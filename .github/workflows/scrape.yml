name: Scrape peer pricing
# 2026-07-10: posting routine is write-free; intel merges via the Confluence inbox (Plan-2).

# Runs at 01:23 UTC — WELL BEFORE the CCR posting routine (07:00 UTC).
# GitHub Actions runners use GitHub's own IPs, which are NOT blocked by the
# Cloudflare/WAF rules that block Anthropic CCR IPs — so this run fetches ALL
# providers live. It generates the ready-to-post artifacts (slack_message.txt,
# slack_thread.txt, confluence_body.html) and commits them. The 07:00 CCR
# routine then just POSTS those fresh, all-live artifacts — it no longer needs
# to re-fetch from blocked IPs (which is why the digest used to show
# "cached 22h ago" for ~9 providers).
#
# Timing: scheduled GitHub crons can lag 2-4h at busy times. 01:23 UTC gives a
# ~5h buffer before the 07:00 CCR so today's fresh data is always ready in time.
# (Previously scheduled 06:00 → actually ran ~09:30 → AFTER the 07:00 CCR, so
# the CCR always read the PRIOR day's cache.) Odd minute avoids :00 congestion.

on:
  schedule:
    - cron: "23 1 * * *"   # 01:23 UTC daily
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push peer_cache.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3>=1.34.0

      - name: Merge field-intel inbox (Confluence -> intel.csv)
        # Plan-2 migration (2026-07-10): the posting routine parks extracted
        # intel on the Confluence "Field Intel Inbox" page (2054817562) because
        # it has no repo write access. This step pulls + validates + merges
        # those rows BEFORE main.py so today's intel renders the same morning.
        # Soft-fails (and skips cleanly until the two secrets are provisioned).
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python3 scripts/intel_inbox_merge.py

      - name: Run full pipeline
        env:
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          # Tavily fallback for JS-rendered/blocked pricing pages (SF Compute, Hyperstack).
          # Nebius-owned; add the secret to activate — without it the fallback no-ops.
          # NB: repo secret is named TAVILY; mapped here to the TAVILY_API_KEY env var the code reads.
          TAVILY_API_KEY: ${{ secrets.TAVILY }}
          # SF Compute transacted fills (optional): free bearer token via `sf tokens create`.
          # Provider auto-registers only when this is set (config.PROVIDERS).
          SFCOMPUTE_TOKEN: ${{ secrets.SFCOMPUTE_TOKEN }}
        run: |
          # All-live run from non-blocked GitHub IPs. main.py writes the daily
          # snapshot, diff, run_manifest, AND the ready-to-post artifacts
          # (slack_message.txt, slack_thread.txt, confluence_body.html).
          python3 main.py 2>&1 | tee /tmp/scrape.log
          echo "--- Pipeline complete ---"
          cat /tmp/scrape.log | grep -E "records|WARNING|ERROR|Diff" || true

      - name: Commit fresh data + ready-to-post artifacts if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit both the data files AND the generated post artifacts so the
          # 07:00 CCR can post them verbatim without re-fetching. run_manifest
          # carries run_date so the CCR can confirm the artifacts are today's.
          git add store/peer_cache.json store/last_snapshot.json store/history.csv \
                  store/run_manifest.json store/slack_message.txt \
                  store/slack_thread.txt store/confluence_body.html \
                  store/spot_auction_body.html store/intel.csv
          if git diff --cached --quiet; then
            echo "No changes — no commit needed"
          else
            git commit -m "chore: fresh data + post artifacts (all-live GHA run) [skip ci]"
            git push
            echo "Data and post artifacts updated and pushed"
          fi
