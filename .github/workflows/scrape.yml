name: Scrape peer pricing

# Runs at 06:00 UTC — one hour before the CCR posting routine (07:00 UTC).
# Fetches all web-scraped providers and updates store/peer_cache.json.
# The CCR routine then clones the repo with a fresh cache and posts to
# Slack / Confluence with up-to-date peer data.
#
# GitHub Actions runners use GitHub's own IPs, which are much less aggressively
# blocked by Cloudflare than Anthropic CCR IPs.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push peer_cache.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests 2>/dev/null || true
          # No requirements.txt yet — stdlib only

      - name: Run full pipeline
        env:
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
        run: |
          # Run all providers (hyperscalers + peers) to build a complete snapshot.
          # This updates peer_cache.json AND last_snapshot.json, which the CCR
          # routine at 07:00 UTC uses as the diff baseline.
          python3 main.py 2>&1 | tee /tmp/scrape.log
          echo "--- Pipeline complete ---"
          cat /tmp/scrape.log | grep -E "records|WARNING|ERROR|Diff" || true

      - name: Commit updated cache and snapshot if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/peer_cache.json store/last_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes — no commit needed"
          else
            git commit -m "chore: update peer_cache + last_snapshot [skip ci]"
            git push
            echo "Cache and snapshot updated and pushed"
          fi
