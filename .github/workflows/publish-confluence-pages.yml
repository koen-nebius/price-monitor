name: Publish Confluence pages (manual)
# One-click re-publish of the committed pricing artifacts
# (store/confluence_body.html, store/spot_auction_body.html) to their
# Confluence pages, without re-running the scrape. Use it when the 01:23 UTC
# build's publish step failed or when today's pages need a refresh now.
# Same script and secrets as the step in scrape.yml. Does not commit anything.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if store/run_manifest.json run_date is not today (UTC)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish pages
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          PUBLISH_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/publish_confluence_pages.py --strict
