name: Scrape peer capacity

# Companion to scrape.yml (pricing). Runs at 02:23 UTC — an hour AFTER the
# pricing scrape (01:23) so the two jobs' pushes don't race; this job also
# pull-rebases before pushing in case the pricing run overlaps on a slow day.
# The 07:10 UTC capacity posting routine then POSTS the committed artifacts
# (capacity/store/slack_message.txt, slack_thread.txt, confluence_body.html)
# — same write-free posting pattern as pricing.

on:
  schedule:
    - cron: "23 2 * * *"   # 02:23 UTC daily
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push capacity/store back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3>=1.34.0

      - name: Bootstrap Confluence page (idempotent, soft-fail)
        # Creates "GPU Competitor Capacity — Live Overview" under the pricing
        # page on the very first run and records its id in
        # capacity/store/confluence_page.json. No-ops on every later run.
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python3 capacity/bootstrap_confluence.py

      - name: Run capacity pipeline
        env:
          # Same secrets as the pricing scrape — capacity fetchers reuse them.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY }}
          SFCOMPUTE_TOKEN: ${{ secrets.SFCOMPUTE_TOKEN }}
        run: |
          python3 -m capacity.main 2>&1 | tee /tmp/capacity.log
          echo "--- Pipeline complete ---"
          grep -E "records|WARNING|ERROR|changes" /tmp/capacity.log || true

      - name: Commit fresh capacity data + post artifacts if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add capacity/store/peer_cache.json capacity/store/last_snapshot.json \
                  capacity/store/history.csv capacity/store/run_manifest.json \
                  capacity/store/slack_message.txt capacity/store/slack_thread.txt \
                  capacity/store/confluence_body.html
          git add capacity/store/confluence_page.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — no commit needed"
          else
            git commit -m "chore: fresh capacity data + post artifacts (GHA run) [skip ci]"
            # The 01:23 pricing job may have pushed while we ran — rebase, then push
            git pull --rebase origin main
            git push
            echo "Capacity data and post artifacts updated and pushed"
          fi
