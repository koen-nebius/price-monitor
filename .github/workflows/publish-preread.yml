name: Publish managed-DB preread
# Manual one-click publisher for analysis/managed_db_preread.html -> Confluence
# (space PR). Exists because the interactive Atlassian MCP connection is
# intermittent; this path uses the same repo secrets as the intel merge.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish preread page
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python3 scripts/publish_preread.py
