<style>
#pos{display:none}
#pos.on{display:block}
.pos-controls{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px 0 10px}
.pos-head{font:400 clamp(22px,2.8vw,32px)/1.25 var(--serif);color:var(--white);letter-spacing:-.01em;margin:12px 0 4px;font-variant-numeric:tabular-nums;text-wrap:balance;max-width:1100px}
.pos-head .dim{color:var(--muted)}
.pos-tags{display:flex;gap:8px;flex-wrap:wrap;min-height:22px;margin-bottom:10px}
.tag{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:5px;border:1px solid var(--thin);color:var(--thin)}
.tag.grey{border-color:var(--line);color:var(--muted)}
.pos-body{display:grid;grid-template-columns:1fr 230px;gap:26px;align-items:start}
@media (max-width:1200px){.pos-body{grid-template-columns:1fr}.pos-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px}}
svg.ladder{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.pos-stats{display:grid;gap:10px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.pos-stats .st{border-top:1px solid var(--line-soft);padding-top:8px}
.pos-stats .k{color:var(--muted);font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pos-stats .v{color:var(--text);font-size:16px;margin-top:2px}
.pos-stats .v.neg{color:var(--neg)}
.pos-stats .s{color:var(--dim);font-size:11px;margin-top:2px}
.price-in{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px}
.price-in span{color:var(--muted);font-family:var(--mono)}
.price-in input{width:88px;background:transparent;border:0;color:var(--white);font:500 15px/1 var(--mono);outline:none}
.price-in input:focus-visible{outline:2px solid var(--white);border-radius:4px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.step button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 15px/1 var(--mono);width:28px;height:28px;border-radius:6px;cursor:pointer}
.step button:hover{color:var(--text);background:var(--surface-2)}
.step output{min-width:44px;text-align:center;color:var(--text);font:500 13px/1 var(--mono)}
.copy{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 12px/1 var(--sans);padding:9px 12px;border-radius:8px;cursor:pointer}
.copy:hover{border-color:var(--ghost-strong)}
.pos-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;color:var(--muted);font-size:12px;font-family:var(--sans)}
.pos-legend span{display:inline-flex;align-items:center;gap:7px}
.lg{display:inline-block;width:11px;height:11px}
.lg.dot{border-radius:50%} .lg.dot.white{background:#f2f2ef} .lg.dot.grey{background:#a8a8b3} .lg.dot.faded{background:#4a4a55} .lg.dot.hollow{border:1.5px solid #a8a8b3}
.lg.sq{background:#a8a8b3} .lg.dia{border:1.8px solid #fff;transform:rotate(45deg);width:9px;height:9px} .lg.bar{width:3px;height:16px;background:#fff} .lg.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #c9c9cf}
.pos-notes{color:var(--muted);font-size:13px;max-width:70ch;margin-top:22px}
.pos-notes b{color:var(--text);font-weight:500}
</style>

<section id="pos" aria-label="Price positioning">
  <div class="pos-controls">
    <div class="row"><span class="label">GPU</span><div class="pills" id="pos-tier" role="group" aria-label="GPU tier"></div>
      <span class="label">Segment</span><div class="pills" id="pos-seg" role="group" aria-label="Nebius grid segment">
        <button class="pill" data-seg="ai_native_above_512" aria-pressed="true">AI Native</button>
        <button class="pill" data-seg="enterprise_above_512" aria-pressed="false">Enterprise</button></div></div>
    <div class="row"><span class="label">Prepay</span><div class="pills" id="pos-prepay" role="group" aria-label="Prepayment of the candidate offer">
        <button class="pill" data-pp="0" aria-pressed="true">0%</button><button class="pill" data-pp="25" aria-pressed="false">25%</button>
        <button class="pill" data-pp="50" aria-pressed="false">50%</button><button class="pill" data-pp="75" aria-pressed="false">75%</button>
        <button class="pill" data-pp="100" aria-pressed="false">100%</button></div>
      <span class="label">Candidate price</span>
      <label class="price-in"><span>$</span><input id="pos-price" type="number" step="0.05" min="0" inputmode="decimal" aria-label="Candidate price per GPU-hour"><span>/GPU-hr</span></label>
      <span class="label">Occupancy</span>
      <div class="step" role="group" aria-label="Billable occupancy"><button id="util-dn" aria-label="lower occupancy">−</button><output id="util-out">75%</output><button id="util-up" aria-label="raise occupancy">+</button></div>
      <button class="copy" id="pos-copy">Copy deal-review line</button>
    </div>
  </div>
  <div class="pos-head" id="pos-head">–</div>
  <div class="pos-tags" id="pos-tags"></div>
  <div class="pos-body">
    <div><svg class="ladder" id="pos-ladder" viewBox="0 0 1100 520" role="img" aria-label="Competitor quotes by commitment length with the candidate price as a vertical rule"></svg></div>
    <div class="pos-stats" id="pos-stats"></div>
  </div>
  <div class="pos-legend" id="pos-legend"></div>
  <div class="pos-notes" id="pos-notes"></div>
</section>

<script>
(function(){
  const TENORS = DATA.params.tenors_months, TIERS = DATA.params.tiers, P = DATA.params;
  const LABEL = {3:"3m",6:"6m",12:"12m",18:"18m",24:"24m",36:"36m",60:"60m"};
  const OBS = DATA.observations || [], QE = DATA.quarter_effects_log || {};
  const ECON = (DATA.economics && DATA.economics.families) || {}, ECON_META = DATA.economics || {};
  const GRID = (DATA.grid && DATA.grid.segments) || {};
  const AS_OF = new Date(DATA.as_of + "T00:00:00Z");
  const refTier = {}; DATA.marks.forEach(m => { (refTier[m.tier] = refTier[m.tier] || {})[m.tenor_months] = m; });
  const fmt = v => (v == null || !isFinite(v) ? "–" : "$" + Number(v).toFixed(2));
  const fmt0 = v => (v == null || !isFinite(v) ? "–" : "$" + Math.round(v).toLocaleString("en-US"));
  const pctf = v => (v == null || !isFinite(v) ? "–" : Math.round(v * 100) + "%");
  const disc = (months, pp) => Math.min(P.prepay_cap, P.prepay_a * Math.max(0.25, (months || 12) / 12) * (1 - Math.pow(1 - Math.max(0, Math.min(1, pp / 100)), P.prepay_m || 2)));
  const age = o => (AS_OF - new Date(o.date + "T00:00:00Z")) / 86400000;
  const quotesFor = t => OBS.filter(o => o.tier === t && (o.side === "bid" || o.side === "public"));
  const asksFor = t => OBS.filter(o => o.tier === t && o.side === "ask");
  const hasQuotes = t => quotesFor(t).length >= 3 || asksFor(t).length >= 3;
  const S = { tier: null, tenor: 36, pp: 0, seg: "ai_native_above_512", price: null, util: (ECON_META.occupancy_default || 0.75), dragging: false };
  S.tier = ["B300","GB300","B200","H200","H100","VR","GB200"].find(hasQuotes) || TIERS[0];

  function wmed(vals, wts){ const pr = vals.map((v, i) => [v, wts ? wts[i] : 1]).sort((a, b) => a[0] - b[0]); const tot = pr.reduce((s, p) => s + p[1], 0); let acc = 0; for (const [v, w] of pr) { acc += w; if (acc >= tot / 2) return v; } return pr.length ? pr[pr.length-1][0] : null; }
  function gridCell(seg, tier, tenor){ const cells = (GRID[seg] || {})[tier] || {}; for (const m of Object.keys(cells)) { const mm = Number(m); const b = mm <= 4 ? 3 : mm <= 8 ? 6 : mm <= 14 ? 12 : mm <= 20 ? 18 : mm <= 27 ? 24 : mm <= 42 ? 36 : 60; if (b === tenor) { const pr = cells[m]; const ks = Object.keys(pr).map(Number); const k = ks.reduce((a, c) => Math.abs(c - S.pp) < Math.abs(a - S.pp) ? c : a); return { price: pr[k], prepay: k, months: mm }; } } return null; }
  function economics(tier, price, util){
    const e = ECON[tier]; if (!e) return null;
    const hpm = ECON_META.hours_per_model_month || 730, src = ECON_META.source_hours_per_month || 744;
    const opexMonth = e.cash_opex_per_installed_gpu_hour_usd * src;              // per GPU per month
    const cashSold = opexMonth / (hpm * util);                                    // cash cost per sold hour
    const floor22 = (e.capex_per_gpu_usd / (ECON_META.payback_target_months || 22) + opexMonth) / (hpm * util);
    const netMonth = price * hpm * util - opexMonth;                              // contribution per GPU per month
    const payback = netMonth > 0 ? e.capex_per_gpu_usd / netMonth : Infinity;
    return { e, cashSold, floor22, margin: price - cashSold, marginPct: price > 0 ? (price - cashSold) / price : null, payback, netMonth,
             elecSold: e.electricity_per_installed_gpu_hour_usd * src / (hpm * util) };
  }
  function cellStats(tier, tenor){
    const q = quotesFor(tier).filter(o => o.tenor === tenor);
    const inDate = q.filter(o => age(o) <= 90), stale = q.length - inDate.length;
    let comp = inDate.filter(o => Math.abs(o.prepay - S.pp) <= 12.5), basis = "comparable";
    let mism = inDate.length - comp.length;
    if (comp.length < 6) { comp = inDate; basis = "all prepay levels"; mism = 0; }
    let window = 90;
    if (comp.length < 3) { comp = q.filter(o => age(o) <= 365); basis = "all prepay levels, up to 12 months old"; window = 365; mism = 0; }
    const asks = asksFor(tier).filter(o => o.tenor === tenor && age(o) <= 365);
    const askMed = asks.length ? wmed(asks.map(o => o.price), asks.map(o => o.w)) : null;
    const ref = refTier[tier] && refTier[tier][tenor] || {};
    const reb = v => v == null ? null : v * (1 - disc(tenor, S.pp));   // 0%-basis mark -> chosen prepay
    return { q, inDate, stale, comp, basis, mism, window, asks, askMed, askDeals: asks.reduce((s, o) => s + (o.deals || 0), 0),
             mark: ref.has_mark ? reb(ref.mark) : null, markLo: ref.has_mark ? reb(ref.range_lo) : null, markHi: ref.has_mark ? reb(ref.range_hi) : null, conf: ref.confidence,
             gridAN: gridCell("ai_native_above_512", tier, tenor), gridENT: gridCell("enterprise_above_512", tier, tenor),
             hyper: ref.list_hyperscaler_min, hyperProv: ref.list_hyperscaler_provider, saFloor: ref.cost_floor };
  }
  function rank(comp, price){ const n = comp.length; const below = comp.filter(o => o.price > price).length, atOrUnder = n - below; return { n, below, pct: n ? atOrUnder / n : null, ordinal: n ? (comp.filter(o => o.price < price).length + 1) : null }; }
  const ord = k => k + (k % 10 === 1 && k !== 11 ? "st" : k % 10 === 2 && k !== 12 ? "nd" : k % 10 === 3 && k !== 13 ? "rd" : "th");

  // ---------- controls
  const tp = document.getElementById("pos-tier");
  TIERS.forEach(t => { const b = document.createElement("button"); b.className = "pill"; b.textContent = t; b.dataset.tier = t; b.disabled = !hasQuotes(t); b.addEventListener("click", () => { S.tier = t; S.price = null; pickTenor(); render(); }); tp.appendChild(b); });
  document.querySelectorAll("#pos-seg .pill").forEach(b => b.addEventListener("click", () => { S.seg = b.dataset.seg; render(); }));
  document.querySelectorAll("#pos-prepay .pill").forEach(b => b.addEventListener("click", () => { S.pp = Number(b.dataset.pp); S.price = null; render(); }));
  const priceIn = document.getElementById("pos-price");
  priceIn.addEventListener("input", () => { const v = parseFloat(priceIn.value); if (isFinite(v) && v > 0) { S.price = v; render(false); } });
  document.getElementById("util-dn").addEventListener("click", () => { S.util = Math.max(0.5, Math.round((S.util - 0.05) * 100) / 100); render(); });
  document.getElementById("util-up").addEventListener("click", () => { S.util = Math.min(0.95, Math.round((S.util + 0.05) * 100) / 100); render(); });
  document.getElementById("pos-copy").addEventListener("click", () => { const line = document.getElementById("pos-head").dataset.line || ""; const ctx = ` [${S.tier} ${LABEL[S.tenor]} ${S.pp}% prepay · occupancy ${Math.round(S.util*100)}% · data as of ${DATA.as_of} · internal marks, not for customers]`; (navigator.clipboard ? navigator.clipboard.writeText(line + ctx) : Promise.reject()).then(() => { const b = document.getElementById("pos-copy"); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy deal-review line", 1400); }, () => {}); });
  function pickTenor(){ const ok = TENORS.filter(t => cellStats(S.tier, t).comp.length >= 3); S.tenor = ok.includes(36) ? 36 : ok.includes(12) ? 12 : (ok[0] || 36); }
  pickTenor();

  // ---------- ladder geometry
  const W = 1100, L = 196, R = 40, TOP = 36, AXIS_H = 40, GAP = 10, H_EXP = 200, H_CMP = 50, DOT = 6, DOT_S = 4.5;
  let xmin = 0, xmax = 10; const X = v => L + Math.max(-0.02, Math.min(1.02, (v - xmin) / (xmax - xmin))) * (W - L - R);
  function domain(tier){
    // zoom to the market: quotes + Nebius signed + marks + grid; hyperscaler rack rates and cost floors are clipped to the edge
    const vals = [];
    quotesFor(tier).filter(o => age(o) <= 365).forEach(o => vals.push(o.price));
    asksFor(tier).filter(o => age(o) <= 365).forEach(o => vals.push(o.price));
    TENORS.forEach(t => { const c = cellStats(tier, t); [c.gridAN && c.gridAN.price, c.gridENT && c.gridENT.price, c.mark].forEach(v => { if (v != null) vals.push(v); }); });
    if (S.price) vals.push(S.price);
    const ec = economics(tier, 1, S.util); if (ec) vals.push(ec.cashSold, ec.floor22);
    vals.sort((a, b) => a - b);
    if (!vals.length) return [0, 10];
    const lo = vals[Math.floor(vals.length * 0.02)], hi = vals[Math.min(vals.length - 1, Math.ceil(vals.length * 0.98) - 1)];
    const pad = Math.max(0.5, (hi - lo) * 0.12);
    return [Math.max(0, Math.floor((lo - pad) * 2) / 2), Math.ceil((hi + pad) * 2) / 2];
  }
  function swarm(items, xOf, minGap){ // returns slot index per item so dots do not overlap horizontally
    const placed = []; return items.map(it => { const x = xOf(it); let slot = 0; while (placed.some(p => p.slot === slot && Math.abs(p.x - x) < minGap)) slot++; placed.push({ x, slot }); return slot; }); }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const T = (x, y, txt, fill, size, extra) => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${fill}" font-family="IBM Plex Mono,monospace" font-size="${size}" ${extra || ""}>${txt}</text>`;
  const TS = (x, y, txt, fill, size, extra) => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${fill}" font-family="Schibsted Grotesk,sans-serif" font-size="${size}" ${extra || ""}>${txt}</text>`;

  function render(updateInput = true){
    document.querySelectorAll("#pos-tier .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.tier === S.tier));
    document.querySelectorAll("#pos-seg .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.seg === S.seg));
    document.querySelectorAll("#pos-prepay .pill").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.pp) === S.pp));
    document.getElementById("util-out").textContent = Math.round(S.util * 100) + "%";
    const cs = cellStats(S.tier, S.tenor);
    if (S.price == null) { const g = S.seg === "enterprise_above_512" ? cs.gridENT : cs.gridAN; S.price = cs.mark != null ? cs.mark : g ? g.price : cs.comp.length ? wmed(cs.comp.map(o => o.price)) : (cs.askMed || 5); S.price = Math.round(S.price * 20) / 20; }
    if (updateInput) priceIn.value = S.price.toFixed(2);
    [xmin, xmax] = domain(S.tier);
    const ec = economics(S.tier, S.price, S.util);
    const rk = rank(cs.comp, S.price);

    // headline: the finding first, the accounting on a second line
    let head = `<span>${fmt(S.price)}</span> <span class="dim">·</span> `;
    if (rk.n >= 6) head += `cheaper than ${rk.below} of ${rk.n} ${cs.basis === "comparable" ? "comparable" : ""} quotes <span class="dim">(${ord(Math.round(rk.pct * 100))} percentile)</span>`;
    else if (rk.n >= 3) head += `${ord(rk.ordinal)} lowest of ${rk.n} quotes`;
    else head += `<span class="dim">too few quotes to rank (${rk.n})</span>`;
    if (ec) head += ` <span class="dim">·</span> ${ec.margin >= 0 ? "+" : "−"}${fmt(Math.abs(ec.margin))}/h over cash cost <span class="dim">·</span> payback ${isFinite(ec.payback) ? Math.round(ec.payback) + " months" : "never"}`;
    else if (cs.saFloor != null) head += ` <span class="dim">·</span> ${S.price >= cs.saFloor ? "+" : "−"}${fmt(Math.abs(S.price - cs.saFloor))}/h vs modeled cost floor`;
    const hd = document.getElementById("pos-head"); hd.innerHTML = head; hd.dataset.line = hd.textContent.replace(/\s+/g, " ").trim();
    const tags = [];
    tags.push(`<span class="tag grey">${S.tier} · ${LABEL[S.tenor]} · ${S.pp}% prepay · ${cs.q.length} quotes on file, ${cs.inDate.length} in the last 90 days${cs.mism ? ", " + cs.mism + " excluded for prepay mismatch" : ""}${cs.basis !== "comparable" ? " · ranked vs " + cs.basis : ""}</span>`);
    if (ec && S.price < ec.cashSold) tags.push(`<span class="tag">below cash cost</span>`);
    if (ec && S.price < ec.floor22) tags.push(`<span class="tag">below 22-month floor ${fmt(ec.floor22)}</span>`);
    if (!ec && cs.saFloor != null && S.price < cs.saFloor) tags.push(`<span class="tag">below modeled cost floor</span>`);
    if (!ec) tags.push(`<span class="tag grey">no Nebius cost model for ${S.tier} in the portfolio workbook</span>`);
    if (Math.abs(S.util - (ECON_META.occupancy_default || 0.75)) > 0.05) tags.push(`<span class="tag grey">occupancy ${Math.round(S.util*100)}% ≠ default ${Math.round((ECON_META.occupancy_default||0.75)*100)}%</span>`);
    document.getElementById("pos-tags").innerHTML = tags.join("");

    // ladder
    const rowsH = TENORS.map(t => t === S.tenor ? H_EXP : H_CMP);
    const H = TOP + rowsH.reduce((a, b) => a + b + GAP, 0) + AXIS_H;
    const g = [`<rect width="${W}" height="${H}" fill="#0b0b0d"/>`,
      `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2a2a33"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5b5b66" stroke-width="2"/></pattern></defs>`];
    const span = xmax - xmin, step = span <= 3 ? 0.5 : span <= 8 ? 1 : 2;
    for (let v = Math.ceil(xmin / step) * step; v <= xmax + 1e-9; v += step) { g.push(`<line x1="${X(v).toFixed(1)}" x2="${X(v).toFixed(1)}" y1="${TOP}" y2="${H-AXIS_H}" stroke="#1d1d24"/>`); g.push(T(X(v), H - AXIS_H + 20, "$" + (step < 1 ? v.toFixed(1) : v.toFixed(0)), "#8b8b95", 12, 'text-anchor="middle"')); }
    g.push(TS(L, H - 6, "$/GPU-hr · quotes as reported, not normalised · axis zoomed to the market; marks beyond it are pinned to the edge", "#5b5b66", 12));
    let y = TOP;
    TENORS.forEach((t, i) => {
      const h = rowsH[i], exp = t === S.tenor, c = cellStats(S.tier, t), r = rank(c.comp, S.price);
      g.push(`<rect x="0" y="${y}" width="${W}" height="${h}" fill="${exp ? "#111116" : "transparent"}" data-row="${t}" style="cursor:pointer"/>`);
      if (exp) g.push(`<rect x="0" y="${y}" width="3" height="${h}" fill="#ffffff"/>`);
      // label column
      const ly = exp ? y + 30 : y + 20;
      g.push(T(16, ly, LABEL[t], exp ? "#f2f2ef" : "#c9c9cf", exp ? 19 : 15, 'font-weight="600" data-row="' + t + '" style="cursor:pointer"'));
      const sub = c.q.length ? (r.n >= 3 ? `cheaper than ${r.below} of ${r.n}` : `${c.q.length} quote${c.q.length>1?"s":""}, too few to rank`) : "no quotes";
      g.push(T(16, ly + 18, sub, c.q.length ? "#8b8b95" : "#3f3f48", 12.5, 'data-row="' + t + '" style="cursor:pointer"'));
      const ecT = economics(S.tier, S.price, S.util);
      if (ecT && c.q.length) { const pays = isFinite(ecT.payback) && ecT.payback <= t; g.push(`<rect x="16" y="${ly + 25}" width="9" height="9" fill="${pays ? "#f2f2ef" : "none"}" stroke="#8b8b95" stroke-width="1"><title>${pays ? "pays back within the term" : "does not pay back within the term"} at ${fmt(S.price)}</title></rect>`); g.push(T(31, ly + 34, pays ? "pays back in term" : "no payback in term", "#5b5b66", 11.5)); }
      // baseline
      const base = exp ? y + 118 : y + 30;
      if (c.q.length || c.askMed != null) g.push(`<line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" stroke="#2a2a31"/>`);
      // quotes as dots (beeswarm upwards from the baseline)
      const inDateSet = new Set(c.inDate), compSet = new Set(c.comp);
      const qs = c.q.filter(o => age(o) <= 365).sort((a, b) => a.price - b.price);
      const dot = exp ? DOT : DOT_S, slots = swarm(qs, o => X(o.price), dot * 2 + 1);
      qs.forEach((o, k) => { const a = age(o); const recent = a <= 90; const under = o.price > S.price && compSet.has(o);
        const cx = X(o.price), cy = base - dot - 1 - slots[k] * (dot * 2 + 1);
        const fill = under ? "#f2f2ef" : recent ? "#a8a8b3" : "#4a4a55", stroke = under ? "#ffffff" : recent ? "#a8a8b3" : "#5b5b66";
        const mism = inDateSet.has(o) && Math.abs(o.prepay - S.pp) > 12.5;
        const title = `<title>${esc(o.provider)} · ${fmt(o.price)} · ${o.prepay}% prepay · ${o.date}${!recent ? " · older than 90 days" : ""}${mism ? " · prepay mismatch, not counted" : ""}${o.side === "public" ? " · public contract (8,760 billed hrs assumed)" : ""}</title>`;
        if (o.side === "public") g.push(`<path d="M${cx.toFixed(1)},${(cy-dot).toFixed(1)} l${dot},${dot} l-${dot},${dot} l-${dot},-${dot} z" fill="${mism?"none":fill}" stroke="${stroke}" stroke-width="1.2">${title}</path>`);
        else if (o.ptype === "hyperscaler" || o.ptype === "undisclosed_hyperscaler") g.push(`<rect x="${(cx-dot).toFixed(1)}" y="${(cy-dot).toFixed(1)}" width="${dot*2}" height="${dot*2}" fill="${mism?"none":fill}" stroke="${stroke}" stroke-width="1.2">${title}</rect>`);
        else g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dot}" fill="${mism?"none":fill}" stroke="${stroke}" stroke-width="1.2">${title}</circle>`);
      });
      // Nebius signed median and market mark, below the baseline so they never collide with quotes
      const under = base + 14;
      if (c.mark != null) { const x0 = X(c.markLo), x1 = X(c.markHi), xm = X(c.mark); g.push(`<rect x="${Math.min(x0,x1).toFixed(1)}" y="${(under-6).toFixed(1)}" width="${Math.max(2,Math.abs(x1-x0)).toFixed(1)}" height="12" fill="rgba(255,255,255,.10)"/>`); g.push(`<rect x="${(xm-1.5).toFixed(1)}" y="${(under-9).toFixed(1)}" width="3" height="18" fill="#ffffff"><title>market mark ${fmt(c.mark)} at ${S.pp}% prepay (${c.conf}) · recent range ${fmt(c.markLo)}–${fmt(c.markHi)}</title></rect>`); if (exp) g.push(T(xm + 8, under + 4, "mark " + fmt(c.mark), "#f2f2ef", 12.5)); }
      if (c.askMed != null) { const x = X(c.askMed); g.push(`<path d="M${x.toFixed(1)},${(under-8).toFixed(1)} l8,8 l-8,8 l-8,-8 z" fill="#0b0b0d" stroke="#ffffff" stroke-width="1.8"><title>Nebius signed median ${fmt(c.askMed)} (${c.askDeals} deals in 12 months)</title></path>`); if (exp) g.push(T(x - 11, under + 4, "signed " + fmt(c.askMed), "#f2f2ef", 12.5, 'text-anchor="end"')); }
      if (exp) {
        // policy rail above the quotes
        const rail = y + 46; const marks = [];
        if (c.gridAN) marks.push({ v: c.gridAN.price, lab: `grid AI Native ${fmt(c.gridAN.price)} @${c.gridAN.prepay}%`, fill: S.seg === "ai_native_above_512" ? "#ffffff" : "none", stroke: "#ffffff" });
        if (c.gridENT) marks.push({ v: c.gridENT.price, lab: `grid Enterprise ${fmt(c.gridENT.price)} @${c.gridENT.prepay}%`, fill: S.seg === "enterprise_above_512" ? "#a8a8b3" : "none", stroke: "#a8a8b3" });
        if (c.hyper != null) marks.push({ v: c.hyper, lab: `hyperscaler list ${fmt(c.hyper)}${c.hyper > xmax ? " →" : ""}`, fill: "none", stroke: "#6b6b78" });
        marks.sort((a, b) => a.v - b.v).forEach((m, k) => { const x = X(m.v); const yy = rail + (k % 2) * 16; g.push(`<path d="M${(x-6).toFixed(1)},${yy} l12,0 l-6,9 z" fill="${m.fill}" stroke="${m.stroke}" stroke-width="1.2"><title>${m.lab}</title></path>`); g.push(T(x + 9, yy + 8, m.lab, m.stroke === "#6b6b78" ? "#6b6b78" : "#c9c9cf", 12, m.v > xmax ? 'text-anchor="end" dx="-18"' : "")); });
        // cost lane
        const cy = y + h - 26;
        if (ec) {
          const seg = (x0, x1, fill, title, extra) => `<rect x="${Math.min(x0,x1).toFixed(1)}" y="${cy}" width="${Math.max(0,Math.abs(x1-x0)).toFixed(1)}" height="14" fill="${fill}" ${extra||""}><title>${title}</title></rect>`;
          g.push(seg(X(Math.max(xmin, 0)), X(ec.elecSold), "#8a7a3a", `electricity ${fmt(ec.elecSold)} per sold hour`));
          g.push(seg(X(ec.elecSold), X(ec.cashSold), "#6b6b78", `other cash opex ${fmt(ec.cashSold - ec.elecSold)} per sold hour (rent, bandwidth, personnel, other)`));
          g.push(seg(X(ec.cashSold), X(ec.floor22), "url(#hatch)", `capex recovery for a 22-month payback ${fmt(ec.floor22 - ec.cashSold)} per sold hour`, 'stroke="#5b5b66" stroke-width="1"'));
          g.push(T(X(ec.cashSold) + 4, cy + 27, "cash cost " + fmt(ec.cashSold), "#c9c9cf", 12));
          g.push(T(X(ec.floor22) + 4, cy + 27, "22-month floor " + fmt(ec.floor22), "#c9c9cf", 12, ec.floor22 > xmax ? 'text-anchor="end" dx="-8"' : ""));
          const mx0 = X(ec.cashSold), mx1 = X(S.price), neg = S.price < ec.cashSold;
          g.push(`<line x1="${mx0.toFixed(1)}" x2="${mx1.toFixed(1)}" y1="${cy-8}" y2="${cy-8}" stroke="${neg?"#d9a441":"#f2f2ef"}" stroke-width="2" ${neg?'stroke-dasharray="4 3"':''}/><line x1="${mx0.toFixed(1)}" x2="${mx0.toFixed(1)}" y1="${cy-13}" y2="${cy-3}" stroke="#f2f2ef"/>`);
          g.push(T((mx0 + mx1) / 2, cy - 13, `${neg?"−":"+"}${fmt(Math.abs(ec.margin))} over cash · ${pctf(ec.marginPct)} margin`, neg ? "#d9a441" : "#f2f2ef", 12.5, 'text-anchor="middle"'));
        }
        if (c.saFloor != null) { const x = X(c.saFloor); g.push(`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${cy-4}" y2="${cy+18}" stroke="#d9a441" stroke-width="2" stroke-dasharray="3 2"><title>SemiAnalysis modeled cost floor ${fmt(c.saFloor)}</title></line>`); g.push(T(x + 5, cy + (ec ? 42 : 27), "modeled floor " + fmt(c.saFloor), "#d9a441", 11.5)); }
        g.push(TS(16, cy + 11, "cost view", "#8b8b95", 12, 'font-weight="600"'));
        g.push(TS(16, cy + 26, "Nebius cash cost per sold hour", "#5b5b66", 10.5));
      }
      y += h + GAP;
    });
    // candidate rule + handle
    const rx = X(S.price);
    g.push(`<line x1="${rx.toFixed(1)}" x2="${rx.toFixed(1)}" y1="${TOP-6}" y2="${H-AXIS_H}" stroke="#ffffff" stroke-width="1.5"/>`);
    const selIdx = TENORS.indexOf(S.tenor); const selY = TOP + rowsH.slice(0, selIdx).reduce((a, b) => a + b + GAP, 0);
    g.push(`<circle cx="${rx.toFixed(1)}" cy="${(selY + 118).toFixed(1)}" r="8" fill="#0b0b0d" stroke="#ffffff" stroke-width="2.5" style="cursor:ew-resize" id="pos-handle"><title>drag to change the candidate price</title></circle>`);
    g.push(`<rect x="${(rx-34).toFixed(1)}" y="${TOP-30}" width="68" height="20" rx="4" fill="#ffffff"/>`);
    g.push(T(rx, TOP - 16, fmt(S.price), "#0b0b0d", 12.5, 'text-anchor="middle" font-weight="600"'));
    // legend
    const lgY = H - AXIS_H + 34;
    const svg = document.getElementById("pos-ladder"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = g.join("");
    svg.querySelectorAll("[data-row]").forEach(el => el.addEventListener("click", () => { if (!S.dragging) { S.tenor = Number(el.dataset.row); render(); } }));
    document.getElementById("pos-legend").innerHTML = [
      `<span><i class="lg dot white"></i>quote you undercut</span>`, `<span><i class="lg dot grey"></i>quote in the last 90 days</span>`, `<span><i class="lg dot faded"></i>older quote</span>`,
      `<span><i class="lg dot hollow"></i>prepay mismatch, not counted</span>`, `<span><i class="lg sq"></i>hyperscaler quote</span>`, `<span><i class="lg dia"></i>Nebius signed median</span>`,
      `<span><i class="lg bar"></i>market mark and recent range</span>`, `<span><i class="lg tri"></i>Finance grid / list price</span>`].join("");

    // stats
    const st = [];
    if (ec) {
      st.push(`<div class="st"><div class="k">Cash cost per sold hour</div><div class="v">${fmt(ec.cashSold)}</div><div class="s">at ${Math.round(S.util*100)}% occupancy · electricity ${fmt(ec.elecSold)}</div></div>`);
      st.push(`<div class="st"><div class="k">Margin over cash</div><div class="v ${ec.margin<0?"neg":""}">${ec.margin>=0?"+":"−"}${fmt(Math.abs(ec.margin))} · ${pctf(ec.marginPct)}</div><div class="s">contribution ${fmt0(ec.netMonth)} per GPU per month</div></div>`);
      st.push(`<div class="st"><div class="k">Payback</div><div class="v ${isFinite(ec.payback)&&ec.payback<=22?"":"neg"}">${isFinite(ec.payback) ? Math.round(ec.payback) + " months" : "never"}</div><div class="s">target ${ECON_META.payback_target_months||22} · 22-month floor ${fmt(ec.floor22)} at this occupancy</div></div>`);
      st.push(`<div class="st"><div class="k">Term contribution per GPU</div><div class="v">${fmt0(ec.netMonth * S.tenor)}</div><div class="s">${LABEL[S.tenor]} · capex per GPU ${fmt0(ec.e.capex_per_gpu_usd)}</div></div>`);
      st.push(`<div class="st"><div class="k">22-month floor at 65 / 75 / 90% occupancy</div><div class="v" style="font-size:13px">${[0.65,0.75,0.9].map(u => fmt(economics(S.tier, S.price, u).floor22)).join(" · ")}</div><div class="s">${esc((ec.e.reference_site||"").replace("DC : ",""))}</div></div>`);
    } else {
      st.push(`<div class="st"><div class="k">Cost model</div><div class="v" style="font-size:13px">not in the portfolio workbook for ${S.tier}</div><div class="s">SemiAnalysis modeled floor ${fmt(cs.saFloor)} shown as the dotted tick</div></div>`);
    }
    st.push(`<div class="st"><div class="k">Market at ${S.pp}% prepay · ${LABEL[S.tenor]}</div><div class="v" style="font-size:13px">mark ${fmt(cs.mark)} · signed ${fmt(cs.askMed)}</div><div class="s">grid AI Native ${cs.gridAN?fmt(cs.gridAN.price)+" @"+cs.gridAN.prepay+"%":"–"} · Enterprise ${cs.gridENT?fmt(cs.gridENT.price)+" @"+cs.gridENT.prepay+"%":"–"}</div></div>`);
    document.getElementById("pos-stats").innerHTML = st.join("");
    document.getElementById("pos-notes").innerHTML = `<b>How to read.</b> Each row is one commitment length on a shared price axis, zoomed to where the market trades. Every dot is one competitor quote as reported by sales; white dots are the quotes your price undercuts. The white rule is the candidate price: drag it or type it. The percentile counts comparable quotes only (last 90 days, prepayment within 12.5 points of yours); with fewer than six comparables it ranks against all recent quotes and says so in the grey tag. <b>Cost view</b> is Nebius cash cost per sold hour plus the capex recovery a 22-month payback needs, from the PAYG portfolio model (Finance GPU Calculator inputs, cash-recovery basis, occupancy ${Math.round((ECON_META.occupancy_default||0.75)*100)}% by default). It is a PAYG cost view applied to a term price, not a Reserve P&amp;L. Internal only.`;
  }

  // drag
  const svgEl = document.getElementById("pos-ladder");
  const toPrice = ev => { const r = svgEl.getBoundingClientRect(); const sx = (ev.clientX - r.left) * W / r.width; return Math.max(0.05, Math.round((xmin + ((sx - L) / (W - L - R)) * (xmax - xmin)) * 20) / 20); };
  svgEl.addEventListener("pointerdown", ev => { if (ev.target.id === "pos-handle" || Math.abs(ev.clientX - (svgEl.getBoundingClientRect().left + X(S.price) * svgEl.getBoundingClientRect().width / W)) < 14) { S.dragging = true; svgEl.setPointerCapture(ev.pointerId); S.price = toPrice(ev); render(); } });
  svgEl.addEventListener("pointermove", ev => { if (S.dragging) { S.price = toPrice(ev); render(); } });
  svgEl.addEventListener("pointerup", () => { setTimeout(() => S.dragging = false, 0); });
  svgEl.addEventListener("pointercancel", () => { S.dragging = false; });

  render();
  window.__posRender = render;
})();
</script>
