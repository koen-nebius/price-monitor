<style>
#pos{display:none}
#pos.on{display:block}
.pos-controls{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px 0 10px}
.pos-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:14px 0 6px}
.pos-title h2{font:400 clamp(24px,2.6vw,32px)/1.15 var(--serif);color:var(--white);margin:0;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pos-title h2 .dim{color:var(--muted)}
.badge{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.badge.warn{border-color:var(--thin);color:var(--thin)}
.badge.mode{border-color:var(--ghost-strong);color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:12px 0 18px}
@media (max-width:1000px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card .lead{font:500 20px/1.15 var(--mono);color:var(--white);font-variant-numeric:tabular-nums;margin-bottom:6px}
.card .lead.neg{color:var(--neg)}
.card .lines{font-family:var(--mono);font-size:12.5px;color:var(--text);display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-variant-numeric:tabular-nums}
.card .lines span:nth-child(odd){color:var(--muted)}
.card .note{color:var(--dim);font-size:11.5px;margin-top:8px;line-height:1.4}
.pos-body{display:grid;grid-template-columns:1fr;gap:18px}
svg.ladder{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.price-in{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px}
.price-in span{color:var(--muted);font-family:var(--mono)}
.price-in input{width:88px;background:transparent;border:0;color:var(--white);font:500 15px/1 var(--mono);outline:none}
.price-in input:focus-visible{outline:2px solid var(--white);border-radius:4px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.step button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 15px/1 var(--mono);width:28px;height:28px;border-radius:6px;cursor:pointer}
.step button:hover{color:var(--text);background:var(--surface-2)}
.step output{min-width:44px;text-align:center;color:var(--text);font:500 13px/1 var(--mono)}
.copy{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 12px/1 var(--sans);padding:9px 12px;border-radius:8px;cursor:pointer}
.copy:hover{border-color:var(--ghost-strong)}
.pos-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;color:var(--muted);font-size:12.5px;font-family:var(--sans)}
.pos-legend span{display:inline-flex;align-items:center;gap:7px}
.lg{display:inline-block;width:12px;height:12px}
.lg.dot{border-radius:50%} .lg.dot.white{background:#f2f2ef} .lg.dot.grey{background:#a8a8b3} .lg.dot.faded{background:#4a4a55} .lg.dot.hollow{border:1.5px solid #a8a8b3}
.lg.sq{background:#a8a8b3} .lg.dia{border:1.8px solid #fff;transform:rotate(45deg);width:9px;height:9px} .lg.bar{width:3px;height:16px;background:#fff} .lg.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #c9c9cf}
.details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.details h3{font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.details table{margin-top:4px}
.details td a{color:var(--text)}
.details tr.sel td{background:var(--surface)}
.details td.dim{color:var(--dim)}
.pos-notes{color:var(--muted);font-size:13px;max-width:78ch;margin-top:20px}
.pos-notes b{color:var(--text);font-weight:500}
</style>

<section id="pos" aria-label="Price positioning">
  <div class="pos-controls">
    <div class="row"><span class="label">GPU</span><div class="pills" id="pos-tier" role="group" aria-label="GPU tier"></div>
      <span class="label">Prepay</span><div class="pills" id="pos-prepay" role="group" aria-label="Prepayment of the candidate offer">
        <button class="pill" data-pp="0" aria-pressed="true">0%</button><button class="pill" data-pp="25" aria-pressed="false">25%</button>
        <button class="pill" data-pp="50" aria-pressed="false">50%</button><button class="pill" data-pp="75" aria-pressed="false">75%</button>
        <button class="pill" data-pp="100" aria-pressed="false">100%</button></div>
      <span class="label">Candidate price</span>
      <label class="price-in"><span>$</span><input id="pos-price" type="number" step="0.05" min="0" inputmode="decimal" aria-label="Candidate price per GPU-hour"><span>/GPU-hr</span></label></div>
    <div class="row"><span class="label">Compare on</span><div class="pills" id="pos-basis" role="group" aria-label="Comparison basis">
        <button class="pill" data-cb="adjusted" aria-pressed="true">Adjusted to today and this prepay</button>
        <button class="pill" data-cb="raw" aria-pressed="false">Raw · last 90 days · matching prepay</button></div>
      <button class="tog" id="t-unknown" aria-pressed="false"><i></i>Include offers with unknown prepay (as 0%)</button>
      <span class="label">Segment</span><div class="pills" id="pos-seg" role="group" aria-label="Nebius grid segment">
        <button class="pill" data-seg="ai_native_above_512" aria-pressed="true">AI Native</button>
        <button class="pill" data-seg="enterprise_above_512" aria-pressed="false">Enterprise</button></div></div>
    <div class="row"><span class="label">Economics</span><div class="pills" id="pos-mode" role="group" aria-label="Economics mode">
        <button class="pill" data-mode="reserve" aria-pressed="true">Reserve contract</button>
        <button class="pill" data-mode="payg" aria-pressed="false">PAYG cash-recovery scenario</button></div>
      <span class="label" id="util-label">Occupancy</span>
      <div class="step" role="group" aria-label="Billable occupancy" id="util-step"><button id="util-dn" aria-label="lower occupancy">−</button><output id="util-out">75%</output><button id="util-up" aria-label="raise occupancy">+</button></div>
      <button class="copy" id="pos-copy">Copy deal-review line</button></div>
  </div>

  <div class="pos-title"><h2 id="pos-title">–</h2><span class="badge mode" id="pos-mode-badge"></span><span id="pos-flags"></span></div>
  <div class="cards">
    <div class="card" id="card-market"></div>
    <div class="card" id="card-finance"></div>
    <div class="card" id="card-econ"></div>
  </div>
  <div class="pos-body">
    <div><svg class="ladder" id="pos-ladder" viewBox="0 0 1100 560" role="img" aria-label="Competitor offers by commitment length with the candidate price as a vertical rule"></svg></div>
  </div>
  <div class="pos-legend" id="pos-legend"></div>
  <div class="details" id="pos-details"></div>
  <div class="pos-notes" id="pos-notes"></div>
</section>

<script>
(function(){
  const TENORS = DATA.params.tenors_months, TIERS = DATA.params.tiers, P = DATA.params;
  const LABEL = {3:"3m",6:"6m",12:"12m",18:"18m",24:"24m",36:"36m",60:"60m"};
  const OBS = DATA.observations || [], QE = DATA.quarter_effects_log || {};
  const ECON = (DATA.economics && DATA.economics.families) || {}, EM = DATA.economics || {};
  const GRID = (DATA.grid && DATA.grid.segments) || {};
  const AS_OF = new Date(DATA.as_of + "T00:00:00Z");
  const MONEY_RATE = 0.069;   // Finance money-cost convention behind the prepay factors (3.45%/yr of tenor on the average balance)
  const refTier = {}; DATA.marks.forEach(m => { (refTier[m.tier] = refTier[m.tier] || {})[m.tenor_months] = m; });
  const fmt = v => (v == null || !isFinite(v) ? "–" : "$" + Number(v).toFixed(2));
  const fmt0 = v => (v == null || !isFinite(v) ? "–" : "$" + Math.round(v).toLocaleString("en-US"));
  const pctf = v => (v == null || !isFinite(v) ? "–" : Math.round(v * 100) + "%");
  const disc = (months, pp) => Math.min(P.prepay_cap, P.prepay_a * Math.max(0.25, (months || 12) / 12) * (1 - Math.pow(1 - Math.max(0, Math.min(1, pp / 100)), P.prepay_m || 2)));
  const age = o => (AS_OF - new Date(o.date + "T00:00:00Z")) / 86400000;
  const adjTo = (o, pp) => o.p0 * Math.exp(-(QE[o.q] || 0)) * (1 - disc(o.months || o.tenor, pp));   // 0%-basis, today's level -> chosen prepay
  const offersFor = t => OBS.filter(o => o.tier === t && o.side === "bid");
  const asksFor = t => OBS.filter(o => o.tier === t && o.side === "ask");
  const pubsFor = t => OBS.filter(o => o.tier === t && o.side === "public");
  const hasData = t => offersFor(t).length >= 3 || asksFor(t).length >= 3;
  const S = { tier: null, tenor: 36, pp: 0, seg: "ai_native_above_512", price: null, mode: "reserve", util: (EM.occupancy_default || 0.75), cb: "adjusted", unknown: false, dragging: false, pick: null };
  S.tier = ["B300","GB300","B200","H200","H100","VR","GB200"].find(hasData) || TIERS[0];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function wmed(vals, wts){ const pr = vals.map((v, i) => [v, wts ? wts[i] : 1]).sort((a, b) => a[0] - b[0]); const tot = pr.reduce((s, p) => s + p[1], 0); let acc = 0; for (const [v, w] of pr) { acc += w; if (acc >= tot / 2) return v; } return pr.length ? pr[pr.length-1][0] : null; }
  const ord = k => k + (k % 10 === 1 && k !== 11 ? "st" : k % 10 === 2 && k !== 12 ? "nd" : k % 10 === 3 && k !== 13 ? "rd" : "th");

  // ---------- Finance grid: only the column that exists; never re-based
  function gridCell(seg, tier, tenor){
    const cells = (GRID[seg] || {})[tier] || {};
    for (const m of Object.keys(cells)) { const mm = Number(m); const b = mm <= 4 ? 3 : mm <= 8 ? 6 : mm <= 14 ? 12 : mm <= 20 ? 18 : mm <= 27 ? 24 : mm <= 42 ? 36 : 60;
      if (b === tenor) { const pr = cells[m]; const ks = Object.keys(pr).map(Number); const exact = ks.includes(S.pp) ? S.pp : null; const nearest = ks.reduce((a, c) => Math.abs(c - S.pp) < Math.abs(a - S.pp) ? c : a);
        return { months: mm, exact, price: exact != null ? pr[exact] : null, nearest, nearestPrice: pr[nearest], columns: ks.sort((a, b) => b - a).map(k => k + "%: " + fmt(pr[k])).join(" · ") }; } }
    return null;
  }

  // ---------- economics
  function economicsPayg(tier, price, util){ const e = ECON[tier]; if (!e) return null; const hpm = EM.hours_per_model_month || 730, src = EM.source_hours_per_month || 744; const opexM = e.cash_opex_per_installed_gpu_hour_usd * src; const cashSold = opexM / (hpm * util);
    const m = refTier[tier] && refTier[tier][12] && refTier[tier][12].mark; return { cashSold, mark0: m || price }; }
  function econ(tier, price, months, pp, mode, util){
    const e = ECON[tier]; if (!e) return null;
    const hpm = EM.hours_per_model_month || 730, src = EM.source_hours_per_month || 744;
    const billed = mode === "reserve" ? 1 : util;                 // a committed reservation bills 100% of contracted hours
    const hours = hpm * billed;                                     // billed GPU-hours per month
    const tcv = price * hours * months;
    const opexM = e.cash_opex_per_installed_gpu_hour_usd * src, elecM = e.electricity_per_installed_gpu_hour_usd * src;
    const upfront = mode === "reserve" ? tcv * pp / 100 : 0, monthly = (tcv - upfront) / months;
    let cum = upfront, payback = cum >= e.capex_per_gpu_usd ? 0 : null, pv = upfront;
    const r = MONEY_RATE / 12;
    for (let m = 1; m <= months; m++) { const prev = cum; cum += monthly - opexM; pv += (monthly - opexM) / Math.pow(1 + r, m);
      if (payback == null && cum >= e.capex_per_gpu_usd) payback = m - 1 + (e.capex_per_gpu_usd - prev) / (cum - prev); }
    const contribution = tcv - opexM * months, residual = e.capex_per_gpu_usd - contribution;
    const cashSold = opexM / hours, floor22 = (e.capex_per_gpu_usd / (EM.payback_target_months || 22) + opexM) / hours;
    const payg = economicsPayg(tier, price, EM.occupancy_default || 0.75);
    const resaleMonths = residual > 0 && payg ? residual / Math.max(1e-6, (payg.mark0 - payg.cashSold) * hpm * (EM.occupancy_default || 0.75)) : 0;
    return { e, tcv, upfront, monthly, opexM, elecM, cashSold, elecSold: elecM / hours, floor22, margin: price - cashSold, marginPct: price > 0 ? (price - cashSold) / price : null,
             payback, contribution, residual, pv, pvNet: pv - e.capex_per_gpu_usd, hours, billed, resaleMonths, payg };
  }

  // ---------- comparison sets
  function cellStats(tier, tenor){
    const all = offersFor(tier).filter(o => o.tenor === tenor && age(o) <= 365);
    const known = all.filter(o => o.known), unknown = all.filter(o => !o.known);
    let comp, compVal, basisLabel;
    if (S.cb === "raw") { comp = all.filter(o => age(o) <= 90 && o.known && Math.abs(o.prepay - S.pp) <= 12.5); if (S.unknown) comp = comp.concat(unknown.filter(o => age(o) <= 90 && S.pp <= 12.5)); compVal = o => o.price; basisLabel = "raw prices, last 90 days, prepay within 12.5 points" + (S.unknown ? ", unknown prepay treated as 0%" : ""); }
    else { comp = S.unknown ? all : known; compVal = o => adjTo(o, S.pp); basisLabel = "adjusted to today's level and " + S.pp + "% prepay" + (S.unknown ? ", unknown prepay treated as 0%" : ", stated prepay only"); }
    const excluded = all.filter(o => !comp.includes(o));
    const asks = asksFor(tier).filter(o => o.tenor === tenor && age(o) <= 365);
    const askAt = asks.length ? wmed(asks.map(o => adjTo(o, S.pp)), asks.map(o => o.w)) : null;
    const askRaw90 = asks.filter(o => age(o) <= 90); const askRaw = askRaw90.length ? wmed(askRaw90.map(o => o.price), askRaw90.map(o => o.w)) : null;
    const pubs = pubsFor(tier).filter(o => o.tenor === tenor);
    const ref = refTier[tier] && refTier[tier][tenor] || {};
    const reb = v => v == null ? null : v * (1 - disc(tenor, S.pp));
    return { all, known, unknown, comp, compVal, basisLabel, excluded, asks, askAt, askRaw, askDeals: asks.reduce((s, o) => s + (o.deals || 0), 0), pubs,
             mark: ref.has_mark ? reb(ref.mark) : null, markLo: ref.has_mark ? reb(ref.range_lo) : null, markHi: ref.has_mark ? reb(ref.range_hi) : null, conf: ref.confidence, nProviders: ref.n_providers,
             recentRaw: ref.recent_raw_median, nRecent90: ref.n_recent90,
             gridAN: gridCell("ai_native_above_512", tier, tenor), gridENT: gridCell("enterprise_above_512", tier, tenor), hyper: ref.list_hyperscaler_min, hyperProv: ref.list_hyperscaler_provider, saFloor: ref.cost_floor };
  }
  function rank(cs, price){ const vals = cs.comp.map(cs.compVal); const n = vals.length, above = vals.filter(v => v > price).length; return { n, above, below: n - above, pct: n ? (n - above) / n : null, ordinal: n ? vals.filter(v => v < price).length + 1 : null, vals }; }

  // ---------- controls
  const tp = document.getElementById("pos-tier");
  TIERS.forEach(t => { const b = document.createElement("button"); b.className = "pill"; b.textContent = t; b.dataset.tier = t; b.disabled = !hasData(t); b.addEventListener("click", () => { setTier(t); sync(); }); tp.appendChild(b); });
  function setTier(t){ S.tier = t; S.price = null; S.pick = null; pickTenor(); render(); }
  document.querySelectorAll("#pos-prepay .pill").forEach(b => b.addEventListener("click", () => { S.pp = Number(b.dataset.pp); S.price = null; render(); sync(); }));
  document.querySelectorAll("#pos-basis .pill").forEach(b => b.addEventListener("click", () => { S.cb = b.dataset.cb; render(); }));
  document.getElementById("t-unknown").addEventListener("click", () => { S.unknown = !S.unknown; render(); });
  document.querySelectorAll("#pos-seg .pill").forEach(b => b.addEventListener("click", () => { S.seg = b.dataset.seg; render(); }));
  document.querySelectorAll("#pos-mode .pill").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; render(); }));
  const priceIn = document.getElementById("pos-price");
  priceIn.addEventListener("input", () => { const v = parseFloat(priceIn.value); if (isFinite(v) && v > 0) { S.price = v; render(false); } });
  document.getElementById("util-dn").addEventListener("click", () => { S.util = Math.max(0.5, Math.round((S.util - 0.05) * 100) / 100); render(); });
  document.getElementById("util-up").addEventListener("click", () => { S.util = Math.min(0.95, Math.round((S.util + 0.05) * 100) / 100); render(); });
  document.getElementById("pos-copy").addEventListener("click", () => { const line = document.getElementById("pos-title").dataset.line || ""; (navigator.clipboard ? navigator.clipboard.writeText(line) : Promise.reject()).then(() => { const b = document.getElementById("pos-copy"); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy deal-review line", 1400); }, () => {}); });
  function pickTenor(){ const ok = TENORS.filter(t => cellStats(S.tier, t).comp.length >= 3); S.tenor = ok.includes(36) ? 36 : ok.includes(12) ? 12 : (ok[0] || 36); }
  pickTenor();
  // cross-tab sync (tier + prepay basis) with the curve tab
  let syncing = false;
  function sync(){ if (syncing || !window.__curveSet) return; syncing = true; try { window.__curveSet({ tier: S.tier, basis: S.pp }); } finally { syncing = false; } }
  window.__posSet = st => { if (syncing) return; syncing = true; try { let changed = false; if (st.tier && st.tier !== S.tier && hasData(st.tier)) { S.tier = st.tier; S.price = null; S.pick = null; pickTenor(); changed = true; } if (st.basis != null && [0,25,50,75,100].includes(st.basis) && st.basis !== S.pp) { S.pp = st.basis; S.price = null; changed = true; } if (changed) render(); } finally { syncing = false; } };

  // ---------- ladder geometry
  const W = 1100, L = 200, R = 40, TOP = 40, AXIS_H = 44, GAP = 10, H_EXP = 212, H_CMP = 52, DOT = 7, DOT_S = 5;
  let xmin = 0, xmax = 10; const X = v => L + Math.max(-0.02, Math.min(1.02, (v - xmin) / (xmax - xmin))) * (W - L - R);
  function domain(tier){
    const vals = [];
    TENORS.forEach(t => { const c = cellStats(tier, t); c.all.forEach(o => vals.push(S.cb === "raw" ? o.price : adjTo(o, S.pp))); if (c.askAt != null) vals.push(c.askAt); if (c.mark != null) vals.push(c.mark); [c.gridAN, c.gridENT].forEach(gc => { if (gc && gc.price != null) vals.push(gc.price); }); });
    if (S.price) vals.push(S.price);
    const ec = econ(tier, S.price || 1, S.tenor, S.pp, S.mode, S.util); if (ec) vals.push(ec.cashSold, ec.floor22);
    vals.sort((a, b) => a - b);
    if (!vals.length) return [0, 10];
    const lo = vals[Math.floor(vals.length * 0.02)], hi = vals[Math.min(vals.length - 1, Math.ceil(vals.length * 0.98) - 1)];
    const pad = Math.max(0.5, (hi - lo) * 0.12);
    return [Math.max(0, Math.floor((lo - pad) * 2) / 2), Math.ceil((hi + pad) * 2) / 2];
  }
  function swarm(items, xOf, minGap){ const placed = []; return items.map(it => { const x = xOf(it); let slot = 0; while (placed.some(p => p.slot === slot && Math.abs(p.x - x) < minGap)) slot++; placed.push({ x, slot }); return slot; }); }
  const T = (x, y, txt, fill, size, extra) => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${fill}" font-family="IBM Plex Mono,monospace" font-size="${size}" ${extra || ""}>${txt}</text>`;
  const TS = (x, y, txt, fill, size, extra) => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${fill}" font-family="Schibsted Grotesk,sans-serif" font-size="${size}" ${extra || ""}>${txt}</text>`;

  function render(updateInput = true){
    document.querySelectorAll("#pos-tier .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.tier === S.tier));
    document.querySelectorAll("#pos-prepay .pill").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.pp) === S.pp));
    document.querySelectorAll("#pos-basis .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.cb === S.cb));
    document.querySelectorAll("#pos-seg .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.seg === S.seg));
    document.querySelectorAll("#pos-mode .pill").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
    document.getElementById("t-unknown").setAttribute("aria-pressed", S.unknown);
    document.getElementById("util-step").style.display = S.mode === "payg" ? "" : "none"; document.getElementById("util-label").style.display = S.mode === "payg" ? "" : "none";
    document.getElementById("util-out").textContent = Math.round(S.util * 100) + "%";
    const cs = cellStats(S.tier, S.tenor);
    if (S.price == null) { S.price = cs.mark != null ? cs.mark : (cs.gridAN && cs.gridAN.price) || (cs.comp.length ? wmed(cs.comp.map(cs.compVal)) : (cs.askAt || 5)); S.price = Math.round(S.price * 20) / 20; }
    if (updateInput) priceIn.value = S.price.toFixed(2);
    [xmin, xmax] = domain(S.tier);
    const ec = econ(S.tier, S.price, S.tenor, S.pp, S.mode, S.util);
    const rk = rank(cs, S.price);
    const grid = S.seg === "enterprise_above_512" ? cs.gridENT : cs.gridAN;

    // title + badges
    const ttl = document.getElementById("pos-title");
    ttl.innerHTML = `${S.tier} <span class="dim">·</span> ${LABEL[S.tenor]} <span class="dim">·</span> ${S.pp}% prepay <span class="dim">·</span> candidate ${fmt(S.price)}`;
    const rankTxt = rk.n >= 6 ? `cheaper than ${rk.above} of ${rk.n} competitor offers (${ord(Math.round(rk.pct * 100))} percentile)` : rk.n >= 3 ? `${ord(rk.ordinal)} lowest of ${rk.n} competitor offers (too few for a percentile)` : `not ranked: ${rk.n} comparable offer${rk.n === 1 ? "" : "s"}`;
    const pbTxt = e => e.payback == null ? "not within term" : e.payback === 0 ? "at signing" : Math.round(e.payback) + " months";
    const ecTxt = ec ? (S.mode === "reserve" ? `Reserve contract: contribution ${fmt0(ec.contribution)} per GPU over ${LABEL[S.tenor]}, payback ${pbTxt(ec)}` : `PAYG scenario at ${Math.round(S.util*100)}% occupancy: ${ec.margin >= 0 ? "+" : "−"}${fmt(Math.abs(ec.margin))}/h over cash cost, payback ${pbTxt(ec)}`) : "no Nebius cost model for this SKU";
    ttl.dataset.line = `${S.tier} ${LABEL[S.tenor]} ${S.pp}% prepay at ${fmt(S.price)}: ${rankTxt}; ${cs.basisLabel}; ${ecTxt}. Data as of ${DATA.as_of}; internal benchmark, not for customers.`;
    document.getElementById("pos-mode-badge").textContent = S.mode === "reserve" ? "Reserve contract economics · 100% of contracted hours billed" : `PAYG cash-recovery scenario · ${Math.round(S.util*100)}% occupancy`;
    const flags = [];
    if (rk.n < 6) flags.push(`<span class="badge warn">thin evidence</span>`);
    if (ec && S.price < ec.cashSold) flags.push(`<span class="badge warn">below cash cost</span>`);
    if (ec && S.mode === "payg" && S.price < ec.floor22) flags.push(`<span class="badge warn">below 22-month floor</span>`);
    if (ec && S.mode === "reserve" && ec.residual > 0) flags.push(`<span class="badge warn">capex not recovered within term</span>`);
    if (S.unknown) flags.push(`<span class="badge warn">unknown prepay counted as 0%</span>`);
    document.getElementById("pos-flags").innerHTML = flags.join(" ");

    // cards
    const compMed = rk.n ? wmed(rk.vals) : null;
    document.getElementById("card-market").innerHTML = `<h3>Market comparison</h3><div class="lead">${rankTxt}</div><div class="lines">
      <span>basis</span><span>${cs.basisLabel}</span>
      <span>comparable median</span><span>${fmt(compMed)}</span>
      <span>market mark</span><span>${fmt(cs.mark)}${cs.conf ? " · " + cs.conf : ""}${cs.nProviders ? " · " + cs.nProviders + " providers" : ""}</span>
      <span>recent raw median</span><span>${fmt(cs.recentRaw)} <span style="color:var(--dim)">(last 90 days, ${cs.nRecent90 || 0} obs, as reported)</span></span>
      <span>Nebius achieved</span><span>${fmt(cs.askAt)} <span style="color:var(--dim)">adjusted · ${cs.askDeals} deals in 12 months${cs.askRaw != null ? " · raw last 90 days " + fmt(cs.askRaw) : ""}</span></span>
      <span>on file</span><span>${cs.all.length} offers in 12 months · ${cs.known.length} state prepay · ${cs.excluded.length} excluded from ranking</span></div>`;
    const other = S.seg === "enterprise_above_512" ? cs.gridAN : cs.gridENT;
    document.getElementById("card-finance").innerHTML = `<h3>Finance reference · grid ${DATA.grid && DATA.grid.version || ""}</h3>
      <div class="lead">${grid ? (grid.price != null ? fmt(grid.price) + " @" + S.pp + "%" : "no " + S.pp + "% column") : "no grid cell"}</div><div class="lines">
      <span>${S.seg === "enterprise_above_512" ? "Enterprise" : "AI Native"} ${grid ? grid.months + "m" : ""}</span><span>${grid ? grid.columns : "–"}</span>
      <span>${S.seg === "enterprise_above_512" ? "AI Native" : "Enterprise"}</span><span>${other ? other.columns : "–"}</span>
      <span>hyperscaler list</span><span>${fmt(cs.hyper)}${cs.hyperProv ? " " + cs.hyperProv : ""}</span>
      <span>vs grid</span><span>${grid && grid.price != null ? pctf(S.price / grid.price - 1) + " vs the " + S.pp + "% column" : "grid has no " + S.pp + "% column; not compared"}</span></div>
      <div class="note">Grid cells are shown only in the prepay column Finance publishes; they are policy prices, not market observations, and are never re-based.</div>`;
    if (ec) {
      document.getElementById("card-econ").innerHTML = `<h3>${S.mode === "reserve" ? "Reserve contract economics" : "PAYG cash-recovery scenario"}</h3>
        <div class="lead ${ec.contribution < 0 ? "neg" : ""}">${S.mode === "reserve" ? "payback " + pbTxt(ec) : (ec.margin >= 0 ? "+" : "−") + fmt(Math.abs(ec.margin)) + "/h over cash cost"}</div><div class="lines">
        ${S.mode === "reserve" ? `<span>contract value</span><span>${fmt0(ec.tcv)} per GPU · ${fmt0(ec.upfront)} upfront</span>` : `<span>billed hours</span><span>${Math.round(S.util*100)}% of ${EM.hours_per_model_month || 730} per month</span>`}
        <span>cash opex</span><span>${fmt0(ec.opexM)} per GPU-month · ${fmt(ec.cashSold)} per billed hour</span>
        <span>contribution</span><span>${fmt0(ec.contribution)} over ${LABEL[S.tenor]} · PV ${fmt0(ec.pv)} at ${Math.round(MONEY_RATE*1000)/10}%</span>
        <span>capex per GPU</span><span>${fmt0(ec.e.capex_per_gpu_usd)} · ${ec.residual > 0 ? fmt0(ec.residual) + " unrecovered at expiry" : "recovered, " + fmt0(-ec.residual) + " surplus"}</span>
        ${ec.residual > 0 && ec.resaleMonths ? `<span>resale scenario</span><span>≈ ${Math.round(ec.resaleMonths)} more months at the 12m market mark, 75% occupancy</span>` : ""}
        <span>22-month floor</span><span>${fmt(ec.floor22)} per billed hour</span></div>
        <div class="note">${S.mode === "reserve" ? "Cash schedule: prepayment at signing, remainder billed monthly on 100% of contracted hours; payback is the month cumulative cash covers capex. Costs from the PAYG portfolio model (Finance GPU Calculator inputs, cash-recovery basis, " + esc((ec.e.reference_site || "").replace("DC : ", "")) + ")." : "Hours billed = occupancy × 730; this is the portfolio model's PAYG assumption, not a committed contract."}</div>`;
    } else {
      document.getElementById("card-econ").innerHTML = `<h3>Economics</h3><div class="lead" style="font-size:15px">no Nebius cost model for ${S.tier}</div><div class="lines"><span>modeled floor</span><span>${fmt(cs.saFloor)} (SemiAnalysis, third party)</span><span>vs floor</span><span>${cs.saFloor ? pctf(S.price / cs.saFloor - 1) : "–"}</span></div><div class="note">The portfolio workbook has no capital or cash-cost rows for this SKU.</div>`;
    }

    // ladder
    const rowsH = TENORS.map(t => t === S.tenor ? H_EXP : H_CMP);
    const H = TOP + rowsH.reduce((a, b) => a + b + GAP, 0) + AXIS_H;
    const g = [`<rect width="${W}" height="${H}" fill="#0b0b0d"/>`, `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2a2a33"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5b5b66" stroke-width="2"/></pattern></defs>`];
    const span = xmax - xmin, step = span <= 3 ? 0.5 : span <= 8 ? 1 : 2;
    for (let v = Math.ceil(xmin / step) * step; v <= xmax + 1e-9; v += step) { g.push(`<line x1="${X(v).toFixed(1)}" x2="${X(v).toFixed(1)}" y1="${TOP}" y2="${H-AXIS_H}" stroke="#1d1d24"/>`); g.push(T(X(v), H - AXIS_H + 22, "$" + (step < 1 ? v.toFixed(1) : v.toFixed(0)), "#8b8b95", 13, 'text-anchor="middle"')); }
    g.push(TS(L, H - 6, `$/GPU-hr · ${S.cb === "raw" ? "offers as reported" : "offers adjusted to today's level and " + S.pp + "% prepay"} · axis zoomed to the market`, "#5b5b66", 12));
    let y = TOP;
    TENORS.forEach((t, i) => {
      const h = rowsH[i], exp = t === S.tenor, c = cellStats(S.tier, t), r = rank(c, S.price);
      g.push(`<rect x="0" y="${y}" width="${W}" height="${h}" fill="${exp ? "#111116" : "transparent"}" data-row="${t}" style="cursor:pointer"/>`);
      if (exp) g.push(`<rect x="0" y="${y}" width="3" height="${h}" fill="#ffffff"/>`);
      const ly = exp ? y + 32 : y + 22;
      g.push(T(16, ly, LABEL[t], exp ? "#f2f2ef" : "#c9c9cf", exp ? 19 : 15, 'font-weight="600" data-row="' + t + '" style="cursor:pointer"'));
      const sub = c.all.length ? (r.n >= 3 ? `cheaper than ${r.above} of ${r.n}` : c.all.length + " on file, " + r.n + " comparable") : "no offers";
      g.push(T(16, ly + 18, sub, c.all.length ? "#8b8b95" : "#3f3f48", 12.5, 'data-row="' + t + '" style="cursor:pointer"'));
      const ecT = econ(S.tier, S.price, t, S.pp, S.mode, S.util);
      if (ecT && c.all.length) { const pays = ecT.payback != null; g.push(`<rect x="16" y="${ly + 26}" width="9" height="9" fill="${pays ? "#f2f2ef" : "none"}" stroke="#8b8b95" stroke-width="1"/>`); g.push(T(31, ly + 34, pays ? (ecT.payback === 0 ? "capex covered at signing" : "pays back in " + Math.round(ecT.payback) + "m") : "no payback in term", "#5b5b66", 11.5)); }
      const base = exp ? y + 128 : y + 34;
      if (c.all.length || c.askAt != null) g.push(`<line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" stroke="#2a2a31"/>`);
      const val = o => S.cb === "raw" ? o.price : adjTo(o, S.pp);
      const compSet = new Set(c.comp);
      const qs = c.all.slice().sort((a, b) => val(a) - val(b));
      const dot = exp ? DOT : DOT_S, slots = swarm(qs, o => X(val(o)), dot * 2 + 2);
      qs.forEach((o, k) => { const a = age(o), inComp = compSet.has(o), under = inComp && val(o) > S.price;
        const cx = X(val(o)), cy = base - dot - 2 - slots[k] * (dot * 2 + 2);
        const fill = under ? "#f2f2ef" : inComp ? "#a8a8b3" : "#3f3f48", stroke = under ? "#ffffff" : inComp ? "#a8a8b3" : "#6b6b78";
        const hollow = !o.known;
        const title = `<title>${esc(o.provider)} · ${fmt(o.price)} as reported${S.cb !== "raw" ? " → " + fmt(val(o)) + " adjusted" : ""} · ${o.known ? o.prepay + "% prepay" : "prepay not stated"} · ${o.date}${a > 90 ? " · older than 90 days" : ""}${inComp ? "" : " · not in the ranked set"}</title>`;
        const hs = o.ptype === "hyperscaler" || o.ptype === "undisclosed_hyperscaler";
        if (hs) g.push(`<rect x="${(cx-dot).toFixed(1)}" y="${(cy-dot).toFixed(1)}" width="${dot*2}" height="${dot*2}" fill="${hollow?"none":fill}" stroke="${stroke}" stroke-width="1.4" data-obs="${esc(o.ts)}" style="cursor:pointer">${title}</rect>`);
        else g.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dot}" fill="${hollow?"none":fill}" stroke="${stroke}" stroke-width="1.4" data-obs="${esc(o.ts)}" style="cursor:pointer">${title}</circle>`);
      });
      c.pubs.forEach(o => { const x = X(S.cb === "raw" ? o.price : adjTo(o, S.pp)); g.push(`<path d="M${x.toFixed(1)},${base+6} l5,5 l-5,5 l-5,-5 z" fill="none" stroke="#8b8b95" stroke-dasharray="2 1"><title>public contract ${esc(o.provider)} ${Math.round(o.months)}m ${fmt(o.price)} implied (8,760 billed hrs; lower bound; not ranked)</title></path>`); });
      const under = base + 18;
      if (c.mark != null) { const x0 = X(c.markLo), x1 = X(c.markHi), xm = X(c.mark); g.push(`<rect x="${Math.min(x0,x1).toFixed(1)}" y="${(under-6).toFixed(1)}" width="${Math.max(2,Math.abs(x1-x0)).toFixed(1)}" height="12" fill="rgba(255,255,255,.10)"/>`); g.push(`<rect x="${(xm-1.5).toFixed(1)}" y="${(under-10).toFixed(1)}" width="3" height="20" fill="#ffffff"><title>market mark ${fmt(c.mark)} at ${S.pp}% prepay (${c.conf})</title></rect>`); if (exp) g.push(T(xm + 8, under + 5, "mark " + fmt(c.mark), "#f2f2ef", 12.5)); }
      if (c.askAt != null) { const x = X(c.askAt); g.push(`<path d="M${x.toFixed(1)},${(under-9).toFixed(1)} l9,9 l-9,9 l-9,-9 z" fill="#0b0b0d" stroke="#ffffff" stroke-width="1.8"><title>Nebius achieved ${fmt(c.askAt)} adjusted (${c.askDeals} deals in 12 months)</title></path>`); if (exp) g.push(T(x - 12, under + 5, "Nebius achieved " + fmt(c.askAt), "#f2f2ef", 12.5, 'text-anchor="end"')); }
      if (exp) {
        const rail = y + 50; const marks = [];
        [["AI Native", c.gridAN, "#ffffff", S.seg === "ai_native_above_512"], ["Enterprise", c.gridENT, "#a8a8b3", S.seg === "enterprise_above_512"]].forEach(([nm, gc, col, sel]) => { if (!gc) return;
          if (gc.price != null) marks.push({ v: gc.price, lab: `grid ${nm} ${fmt(gc.price)} @${S.pp}%`, fill: sel ? col : "none", stroke: col, dash: "" });
          else marks.push({ v: gc.nearestPrice, lab: `grid ${nm} has no ${S.pp}% column (${gc.nearest}%: ${fmt(gc.nearestPrice)})`, fill: "none", stroke: col, dash: "3 2" }); });
        if (c.hyper != null) marks.push({ v: c.hyper, lab: `hyperscaler list ${fmt(c.hyper)}${c.hyper > xmax ? " →" : ""}`, fill: "none", stroke: "#6b6b78", dash: "" });
        marks.sort((a, b) => a.v - b.v).forEach((m, k) => { const x = X(m.v); const yy = rail + (k % 2) * 17; g.push(`<path d="M${(x-7).toFixed(1)},${yy} l14,0 l-7,10 z" fill="${m.fill}" stroke="${m.stroke}" stroke-width="1.3" stroke-dasharray="${m.dash}"><title>${m.lab}</title></path>`); g.push(T(x + 10, yy + 9, m.lab, m.stroke === "#6b6b78" ? "#6b6b78" : "#c9c9cf", 12, m.v > xmax ? 'text-anchor="end" dx="-20"' : "")); });
        const cy = y + h - 30;
        if (ec) {
          const seg = (x0, x1, fill, title, extra) => `<rect x="${Math.min(x0,x1).toFixed(1)}" y="${cy}" width="${Math.max(0,Math.abs(x1-x0)).toFixed(1)}" height="14" fill="${fill}" ${extra||""}><title>${title}</title></rect>`;
          g.push(seg(X(Math.max(xmin, 0)), X(ec.elecSold), "#8a7a3a", `electricity ${fmt(ec.elecSold)} per billed hour`));
          g.push(seg(X(ec.elecSold), X(ec.cashSold), "#6b6b78", `other cash opex ${fmt(ec.cashSold - ec.elecSold)} per billed hour`));
          g.push(seg(X(ec.cashSold), X(ec.floor22), "url(#hatch)", `capex recovery for a 22-month payback ${fmt(ec.floor22 - ec.cashSold)} per billed hour`, 'stroke="#5b5b66" stroke-width="1"'));
          g.push(T(X(ec.cashSold) + 4, cy + 28, "cash cost " + fmt(ec.cashSold), "#c9c9cf", 12));
          g.push(T(X(ec.floor22) + 4, cy + 28, "22-month floor " + fmt(ec.floor22), "#c9c9cf", 12, ec.floor22 > xmax ? 'text-anchor="end" dx="-8"' : ""));
          const mx0 = X(ec.cashSold), mx1 = X(S.price), neg = S.price < ec.cashSold;
          g.push(`<line x1="${mx0.toFixed(1)}" x2="${mx1.toFixed(1)}" y1="${cy-9}" y2="${cy-9}" stroke="${neg?"#d9a441":"#f2f2ef"}" stroke-width="2" ${neg?'stroke-dasharray="4 3"':''}/>`);
          g.push(T((mx0 + mx1) / 2, cy - 14, `${neg?"−":"+"}${fmt(Math.abs(ec.margin))} over cash per billed hour`, neg ? "#d9a441" : "#f2f2ef", 12.5, 'text-anchor="middle"'));
        }
        if (c.saFloor != null) { const x = X(c.saFloor); g.push(`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${cy-4}" y2="${cy+18}" stroke="#d9a441" stroke-width="2" stroke-dasharray="3 2"><title>SemiAnalysis modeled cost floor ${fmt(c.saFloor)}</title></line>`); g.push(T(x + 5, cy + (ec ? 43 : 28), "modeled floor " + fmt(c.saFloor), "#d9a441", 11.5)); }
        g.push(TS(16, cy + 11, "cost view", "#8b8b95", 12, 'font-weight="600"'));
        g.push(TS(16, cy + 27, S.mode === "reserve" ? "per billed hour, 100% of contracted hours" : `per billed hour at ${Math.round(S.util*100)}% occupancy`, "#5b5b66", 10.5));
      }
      y += h + GAP;
    });
    const rx = X(S.price);
    g.push(`<line x1="${rx.toFixed(1)}" x2="${rx.toFixed(1)}" y1="${TOP-6}" y2="${H-AXIS_H}" stroke="#ffffff" stroke-width="1.5"/>`);
    const selIdx = TENORS.indexOf(S.tenor); const selY = TOP + rowsH.slice(0, selIdx).reduce((a, b) => a + b + GAP, 0);
    g.push(`<circle cx="${rx.toFixed(1)}" cy="${(selY + 128).toFixed(1)}" r="8" fill="#0b0b0d" stroke="#ffffff" stroke-width="2.5" style="cursor:ew-resize" id="pos-handle"><title>drag to change the candidate price</title></circle>`);
    g.push(`<rect x="${(rx-40).toFixed(1)}" y="${TOP-32}" width="80" height="22" rx="4" fill="#ffffff"/>`);
    g.push(T(rx, TOP - 17, fmt(S.price), "#0b0b0d", 13, 'text-anchor="middle" font-weight="600"'));
    const svg = document.getElementById("pos-ladder"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = g.join("");
    svg.querySelectorAll("[data-row]").forEach(el => el.addEventListener("click", () => { if (!S.dragging) { S.tenor = Number(el.dataset.row); S.pick = null; render(); } }));
    svg.querySelectorAll("[data-obs]").forEach(el => el.addEventListener("click", ev => { ev.stopPropagation(); S.pick = el.dataset.obs; renderDetails(cs); const row = document.querySelector(`#pos-details tr[data-ts="${CSS.escape(S.pick)}"]`); if (row) row.scrollIntoView({ block: "nearest" }); }));
    document.getElementById("pos-legend").innerHTML = [
      `<span><i class="lg dot white"></i>competitor offer you undercut</span>`, `<span><i class="lg dot grey"></i>offer in the ranked set</span>`, `<span><i class="lg dot faded"></i>offer on file, not ranked</span>`,
      `<span><i class="lg dot hollow"></i>prepayment not stated</span>`, `<span><i class="lg sq"></i>hyperscaler offer</span>`, `<span><i class="lg dia"></i>Nebius achieved (CRM, adjusted)</span>`,
      `<span><i class="lg bar"></i>market mark and recent range</span>`, `<span><i class="lg tri"></i>Finance grid / list price</span>`, `<span>◇ dashed: public contract, lower bound, not ranked</span>`].join("");
    renderDetails(cs);
    document.getElementById("pos-notes").innerHTML = `<b>How to read.</b> Each row is one commitment length on a shared price axis. Every dot is one competitor offer reported in #price-intelligence, deduplicated by underlying offer; white dots are offers your price undercuts. The ranked set is described in the Market comparison card: by default offers adjusted to today's price level and to the selected prepayment (Finance's money-cost convention), counting only offers that state their prepayment; the raw view keeps reported prices within 90 days and 12.5 prepay points. Offers older than 90 days are lifted by the quarter effects listed on the Curve tab, which is why the recent raw median is shown next to the mark. Nebius achieved prices are CRM aggregates on the same adjusted basis. Finance grid cells are policy, shown only in the column Finance publishes. Economics use the PAYG portfolio model's capital and cash costs; Reserve mode bills 100% of contracted hours and credits prepayment when it is received. Internal only.`;
  }

  function renderDetails(cs){
    const rows = [];
    const link = o => /^\d+\.\d+$/.test(o.ts || "") ? `<a href="https://nebius.slack.com/archives/C06PM90GV0U/p${o.ts.replace(".", "")}" target="_blank" rel="noopener">Slack</a>` : (o.ts || "").startsWith("seed") ? "seed row" : (o.ts || "").startsWith("audit") ? "audit row" : "–";
    cs.all.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach(o => { const inComp = cs.comp.includes(o); rows.push(`<tr data-ts="${esc(o.ts)}" class="${S.pick === o.ts ? "sel" : ""}"><td>offer</td><td>${esc(o.provider)}</td><td>${o.date}</td><td>${Math.round(o.months || o.tenor)}m</td><td>${o.known ? o.prepay + "%" : '<span class="dim">not stated</span>'}</td><td>${fmt(o.price)}</td><td>${fmt(adjTo(o, S.pp))}</td><td class="${inComp ? "" : "dim"}">${inComp ? "ranked" : "not ranked"}</td><td>${link(o)}</td></tr>`); });
    cs.asks.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach(o => rows.push(`<tr><td>Nebius achieved</td><td>${o.deals} deal${o.deals > 1 ? "s" : ""} · ${o.bucket}</td><td>${o.date.slice(0,7)}</td><td>${Math.round(o.months || o.tenor)}m</td><td>${o.prepay}% proxy</td><td>${fmt(o.price)}</td><td>${fmt(adjTo(o, S.pp))}</td><td class="dim">reference</td><td>CRM aggregate</td></tr>`));
    cs.pubs.forEach(o => rows.push(`<tr><td>public contract</td><td>${esc(o.provider)}</td><td>${o.date}</td><td>${Math.round(o.months)}m</td><td>${o.prepay}%</td><td>${fmt(o.price)}</td><td>${fmt(adjTo(o, S.pp))}</td><td class="dim">lower bound</td><td>SemiAnalysis deal table</td></tr>`));
    document.getElementById("pos-details").innerHTML = `<h3><span>Observations behind ${S.tier} · ${LABEL[S.tenor]}</span><span>adjusted = today's level, ${S.pp}% prepay</span></h3>
      <div class="table-wrap" style="margin-top:0"><table><thead><tr><th>Class</th><th>Provider</th><th>Date</th><th>Term</th><th>Prepay</th><th>Reported</th><th>Adjusted</th><th>Status</th><th>Source</th></tr></thead><tbody>${rows.join("") || '<tr><td colspan="9" class="dim">no observations</td></tr>'}</tbody></table></div>`;
  }

  const svgEl = document.getElementById("pos-ladder");
  const toPrice = ev => { const r = svgEl.getBoundingClientRect(); const sx = (ev.clientX - r.left) * W / r.width; return Math.max(0.05, Math.round((xmin + ((sx - L) / (W - L - R)) * (xmax - xmin)) * 20) / 20); };
  svgEl.addEventListener("pointerdown", ev => { if (ev.target.id === "pos-handle" || Math.abs(ev.clientX - (svgEl.getBoundingClientRect().left + X(S.price) * svgEl.getBoundingClientRect().width / W)) < 14) { S.dragging = true; svgEl.setPointerCapture(ev.pointerId); S.price = toPrice(ev); render(); } });
  svgEl.addEventListener("pointermove", ev => { if (S.dragging) { S.price = toPrice(ev); render(); } });
  svgEl.addEventListener("pointerup", () => { setTimeout(() => S.dragging = false, 0); });
  svgEl.addEventListener("pointercancel", () => { S.dragging = false; });

  render();
  window.__posRender = render;
})();
</script>
