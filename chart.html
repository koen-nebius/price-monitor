<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU Competitor Pricing</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d0f18;
    --surface: #151821;
    --card:    #1b1e2d;
    --border:  #252840;
    --text:    #e2e4f0;
    --muted:   #6b7194;
    --accent:  #00b97a;
    --gold:    #f5c842;
    --red:     #e05252;
    --amber:   #e09030;
  }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; min-height:100vh; display:flex; flex-direction:column; }

  /* ── Header ── */
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px 0; flex-wrap:wrap; gap:12px; }
  .header-title h1 { font-size:17px; font-weight:600; }
  .header-title span { font-size:11px; color:var(--muted); margin-top:2px; display:block; }

  /* ── Tabs ── */
  .tab-bar { display:flex; gap:4px; background:var(--card); border-radius:8px; padding:3px; border:1px solid var(--border); }
  .tab-btn { background:transparent; border:none; color:var(--muted); padding:6px 16px; border-radius:6px; font-size:13px; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .tab-btn.active { background:var(--surface); color:var(--text); box-shadow:0 1px 3px #0006; }
  .tab-btn:hover:not(.active) { color:var(--text); }

  /* ── Filters bar ── */
  .filters-bar { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .filter-section { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .filter-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; white-space:nowrap; }
  .filter-sep { width:1px; height:20px; background:var(--border); margin:0 4px; }

  /* Pill buttons */
  .pill-group { display:flex; gap:4px; flex-wrap:wrap; }
  .pill { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:4px 12px; font-size:12px; cursor:pointer; transition:all .12s; white-space:nowrap; }
  .pill:hover { border-color:var(--accent); color:var(--text); }
  .pill.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  .pill.gpu-pill { font-family:monospace; font-size:12px; }

  /* Intel toggle */
  .intel-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; margin-left:auto; }
  .intel-wrap .label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .toggle-track { width:30px; height:17px; border-radius:9px; background:var(--border); position:relative; transition:.2s; flex-shrink:0; }
  .toggle-track::after { content:""; position:absolute; width:11px; height:11px; border-radius:50%; background:var(--muted); top:3px; left:3px; transition:.2s; }
  input.toggle-cb { display:none; }
  input.toggle-cb:checked ~ .toggle-track { background:#f5c84244; border:1px solid var(--gold); }
  input.toggle-cb:checked ~ .toggle-track::after { left:15px; background:var(--gold); }
  .diamond-icon { display:inline-block; width:9px; height:9px; border:1.5px solid var(--gold); transform:rotate(45deg); flex-shrink:0; }

  /* ── Tab content ── */
  .tab-pane { display:none; flex:1; flex-direction:column; }
  .tab-pane.active { display:flex; }

  /* ── Trends layout ── */
  .trends-layout { display:flex; flex:1; overflow:hidden; min-height:0; }
  .chart-wrap { flex:1; position:relative; padding:20px 20px 12px 24px; min-width:0; }
  .focus-chip { position:absolute; top:24px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); border-radius:20px; padding:4px 14px; font-size:12px; color:var(--text); pointer-events:none; opacity:0; transition:opacity .15s; white-space:nowrap; z-index:10; }
  .focus-chip.visible { opacity:1; }
  #no-data { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  canvas { width:100% !important; }

  /* ── Legend panel ── */
  .legend-panel { width:224px; flex-shrink:0; border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .legend-search-wrap { padding:10px 12px; border-bottom:1px solid var(--border); }
  .legend-search { width:100%; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 10px; font-size:12px; outline:none; }
  .legend-search:focus { border-color:var(--accent); }
  .legend-scroll { flex:1; overflow-y:auto; padding:6px 0 12px; }
  .legend-scroll::-webkit-scrollbar { width:4px; }
  .legend-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .legend-group-title { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:8px 12px 4px; }
  .legend-item { display:flex; align-items:center; gap:8px; padding:5px 12px; cursor:pointer; transition:background .1s; border-radius:0; }
  .legend-item:hover { background:var(--card); }
  .legend-item.dimmed { opacity:.25; }
  .legend-item.hidden-ds .legend-name { text-decoration:line-through; color:var(--muted); }
  .legend-swatch { width:18px; height:3px; border-radius:2px; flex-shrink:0; }
  .legend-name { flex:1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .legend-name .you { font-size:10px; color:var(--accent); margin-left:3px; }
  .legend-price { font-size:11px; color:var(--muted); font-family:monospace; white-space:nowrap; }
  .legend-others-toggle { font-size:11px; color:var(--muted); padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:4px; background:none; border:none; width:100%; text-align:left; }
  .legend-others-toggle:hover { color:var(--accent); }
  .legend-others-group { display:none; }
  .legend-others-group.open { display:block; }

  /* ── Snapshot tab ── */
  #tab-snapshot { overflow:auto; }
  .snap-layout { padding:20px 24px; flex:1; display:flex; flex-direction:column; gap:16px; }
  .snap-chart-wrap { position:relative; }
  .snap-chart-wrap canvas { max-height:420px; }
  .snap-summary { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }
  .snap-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
  .snap-card-gpu { font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
  .snap-card-row { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-top:3px; }
  .snap-card-row .label { color:var(--muted); }
  .snap-card-row .val { font-family:monospace; }
  .snap-card-nebius { background:var(--accent)18; border-color:var(--accent)55; }
  .snap-card-nebius .snap-card-gpu { color:var(--accent); }
  .rank-badge { display:inline-block; background:var(--surface); border-radius:4px; padding:1px 6px; font-size:11px; font-family:monospace; }
  .rank-badge.good { background:var(--accent)22; color:var(--accent); }
  .rank-badge.warn { background:var(--amber)22; color:var(--amber); }
  .rank-badge.bad  { background:var(--red)22; color:var(--red); }

  /* ── Footer ── */
  footer { padding:8px 24px 16px; color:var(--muted); font-size:11px; border-top:1px solid var(--border); margin-top:auto; }
  footer a { color:var(--accent); text-decoration:none; }
  footer span { margin:0 8px; opacity:.4; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>GPU Competitor Pricing</h1>
    <span id="data-range">Loading…</span>
  </div>
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="trends">Price Trends</button>
    <button class="tab-btn"        data-tab="snapshot">Market Snapshot</button>
  </nav>
</header>

<!-- ── Tab 1: Price Trends ──────────────────────────────────────────── -->
<div id="tab-trends" class="tab-pane active">
  <div class="filters-bar">
    <div class="filter-section">
      <span class="filter-label">GPU</span>
      <div class="pill-group" id="gpu-pills"></div>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-section">
      <span class="filter-label">Pricing</span>
      <div class="pill-group" id="ct-pills"></div>
    </div>
    <label class="intel-wrap" title="Deal quotes from #price-intelligence (not public rack rates)">
      <input type="checkbox" class="toggle-cb" id="intel-toggle" checked>
      <span class="toggle-track"></span>
      <span class="label"><span class="diamond-icon"></span> Field intel</span>
    </label>
  </div>

  <div class="trends-layout">
    <div class="chart-wrap">
      <div class="focus-chip" id="focus-chip"></div>
      <div id="no-data">No data for this combination.</div>
      <canvas id="chart-trends" height="400"></canvas>
    </div>
    <aside class="legend-panel">
      <div class="legend-search-wrap">
        <input class="legend-search" id="legend-search" type="search" placeholder="Filter providers…">
      </div>
      <div class="legend-scroll" id="legend-list"></div>
    </aside>
  </div>
</div>

<!-- ── Tab 2: Market Snapshot ───────────────────────────────────────── -->
<div id="tab-snapshot" class="tab-pane">
  <div class="filters-bar">
    <div class="filter-section">
      <span class="filter-label">Pricing type</span>
      <div class="pill-group" id="snap-ct-pills"></div>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-section">
      <span class="filter-label">As of</span>
      <div class="pill-group" id="snap-date-pills"></div>
    </div>
  </div>
  <div class="snap-layout">
    <div class="snap-chart-wrap">
      <canvas id="chart-snapshot"></canvas>
    </div>
    <div class="snap-summary" id="snap-summary"></div>
  </div>
</div>

<footer>
  Lines: cheapest price per provider/day from public APIs &amp; pricing pages.
  <span>|</span>
  <span class="diamond-icon"></span> Field intel: deal quotes from <strong>#price-intelligence</strong> (terms in tooltip).
  <span>|</span>
  <a href="https://nebius.atlassian.net/wiki/spaces/PR/pages/1831469419/" target="_blank">Full Confluence benchmark →</a>
</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Constants
// ─────────────────────────────────────────────────────────────────────────────
const CSV_URL        = "store/history.csv";
const INTEL_CSV_URL  = "store/intel.csv";
const GPU_ORDER      = ["H100","H200","B200","B300","GB200","GB300","L40S"];

const CT_PILLS = [
  { label:"On-demand",     cts:["on_demand"] },
  { label:"Spot",          cts:["spot","preemptible"] },
  { label:"Committed 1yr", cts:["committed_1yr","reserved_1yr"] },
  { label:"Committed 2yr", cts:["committed_2yr"] },
  { label:"Committed 3yr", cts:["committed_3yr","reserved_3yr"] },
];
const SNAP_CT_PILLS = [
  { label:"On-demand",     cts:["on_demand"] },
  { label:"Committed 1yr", cts:["committed_1yr","reserved_1yr"] },
  { label:"Committed 3yr", cts:["committed_3yr","reserved_3yr"] },
];

const PROVIDER_DISPLAY = {
  aws:"AWS", gcp:"GCP", azure:"Azure", nebius:"Nebius",
  coreweave:"CoreWeave", lambda:"Lambda", crusoe:"Crusoe",
  cp_oracle:"Oracle", cp_hyperstack:"Hyperstack",
  cp_voltage:"Voltage Park", "cp_gmi-cloud":"GMI Cloud",
  cp_scaleway:"Scaleway", cp_gcore:"Gcore",
  cp_vultr:"Vultr", cp_runpod:"RunPod", cp_vast:"Vast.ai",
  cp_tensordock:"TensorDock", cp_digitalocean:"DigitalOcean",
  cp_paperspace:"Paperspace", cp_genesis:"Genesis Cloud",
};
function provDisp(p) {
  if (PROVIDER_DISPLAY[p]) return PROVIDER_DISPLAY[p];
  return p.replace("cp_","").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

const PROVIDER_COLORS = {
  nebius:"#00b97a", aws:"#FF9900", gcp:"#4285F4", azure:"#0072C6",
  coreweave:"#9B59B6", lambda:"#E84A27", crusoe:"#00BCD4",
  cp_oracle:"#F80000", cp_hyperstack:"#FF6B35", cp_voltage:"#27AE60",
  "cp_gmi-cloud":"#1ABC9C", cp_scaleway:"#7159F5", cp_gcore:"#E91E8C",
  cp_vultr:"#007BFC", cp_runpod:"#AC39FF", cp_vast:"#FFD600",
  cp_tensordock:"#78909C", cp_digitalocean:"#0080FF", cp_paperspace:"#00D084",
};
function provColor(p, idx) {
  if (PROVIDER_COLORS[p]) return PROVIDER_COLORS[p];
  return `hsl(${(idx*47+200)%360},60%,56%)`;
}

const HYPERSCALERS   = new Set(["aws","gcp","azure","cp_oracle"]);
const ENTERPRISE_GPU = new Set(["nebius","coreweave","lambda","crusoe",
  "cp_hyperstack","cp_voltage","cp_gmi-cloud","cp_scaleway","cp_gcore"]);
const KEY_PROVIDERS  = new Set([...HYPERSCALERS, ...ENTERPRISE_GPU]);

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let allRows=[], intelRows=[], allProviders=[];
let chartT1=null, chartT2=null;
let hoveredIdx=null, origStyles=[];

const t1 = { gpu:"H100", ctLabel:"On-demand", visible:new Set(), showIntel:true };
const t2 = { ctLabel:"On-demand", date:null };

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
function parseCsv(url) {
  return new Promise(res => {
    Papa.parse(url, { download:true, header:true, skipEmptyLines:true,
      complete:({data})=>res(data), error:()=>res([]) });
  });
}

function hexToRgba(color, alpha) {
  if (color.startsWith("hsl")) return color.replace("hsl(","hsla(").replace(")",`,${alpha})`);
  const hex = color.replace("#","");
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function ctSet(label, pills) {
  const found = pills.find(p=>p.label===label);
  return found ? new Set(found.cts) : new Set();
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────
Promise.all([parseCsv(CSV_URL), parseCsv(INTEL_CSV_URL)]).then(([hist, intel]) => {
  allRows   = hist;
  intelRows = intel;

  if (!allRows.length) {
    document.getElementById("data-range").textContent = "No data loaded";
    return;
  }

  const dates = [...new Set(allRows.map(r=>r.snapshot_date))].sort();
  document.getElementById("data-range").textContent =
    `${dates.length} daily snapshots  ·  ${dates[0]} → ${dates[dates.length-1]}`;

  // Provider ordering: key providers first
  const pSet = new Set(allRows.map(r=>r.provider));
  const key  = [...KEY_PROVIDERS].filter(p=>pSet.has(p))
    .sort((a,b)=>provDisp(a).localeCompare(provDisp(b)));
  const rest = [...pSet].filter(p=>!KEY_PROVIDERS.has(p))
    .sort((a,b)=>provDisp(a).localeCompare(provDisp(b)));
  allProviders = [...key, ...rest];

  // Default visible = all key providers
  allProviders.filter(p=>KEY_PROVIDERS.has(p)).forEach(p=>t1.visible.add(p));

  // Tab 2: latest date
  t2.date = dates[dates.length-1];

  initTabSwitcher();
  buildGpuPills();
  buildCtPills();
  buildSnapCtPills();
  buildSnapDatePills(dates);
  buildLegend();
  initTrendsChart();
  renderTrends();
  initSnapshotChart();
  renderSnapshot();

  document.getElementById("intel-toggle").addEventListener("change", e => {
    t1.showIntel = e.target.checked;
    renderTrends();
  });
  document.getElementById("legend-search").addEventListener("input", e => {
    filterLegend(e.target.value.toLowerCase());
  });
});

// ─────────────────────────────────────────────────────────────────────────────
// Tab switcher
// ─────────────────────────────────────────────────────────────────────────────
function initTabSwitcher() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
    });
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Pill builders
// ─────────────────────────────────────────────────────────────────────────────
function buildGpuPills() {
  const gpuSet = new Set(allRows.map(r=>r.gpu_model));
  const wrap   = document.getElementById("gpu-pills");
  GPU_ORDER.filter(g=>gpuSet.has(g)).forEach(g => {
    const btn = document.createElement("button");
    btn.className = "pill gpu-pill" + (g===t1.gpu ? " active" : "");
    btn.textContent = g;
    btn.addEventListener("click", () => {
      wrap.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      t1.gpu = g;
      buildCtPills(); // some CTs only exist for certain GPUs
      updateLegendPrices();
      renderTrends();
    });
    wrap.appendChild(btn);
  });
}

function buildCtPills() {
  const gpuCTs = new Set(allRows.filter(r=>r.gpu_model===t1.gpu).map(r=>r.consumption_type));
  const wrap   = document.getElementById("ct-pills");
  wrap.innerHTML = "";
  CT_PILLS.forEach(p => {
    if (!p.cts.some(ct=>gpuCTs.has(ct))) return;
    const btn = document.createElement("button");
    btn.className = "pill" + (p.label===t1.ctLabel ? " active" : "");
    btn.textContent = p.label;
    btn.addEventListener("click", () => {
      wrap.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      t1.ctLabel = p.label;
      updateLegendPrices();
      renderTrends();
    });
    wrap.appendChild(btn);
  });
  // If current ctLabel not available for this GPU, reset
  if (![...wrap.querySelectorAll(".pill.active")].length) {
    const first = wrap.querySelector(".pill");
    if (first) { first.classList.add("active"); t1.ctLabel = first.textContent; }
  }
}

function buildSnapCtPills() {
  const wrap = document.getElementById("snap-ct-pills");
  SNAP_CT_PILLS.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "pill" + (p.label===t2.ctLabel ? " active" : "");
    btn.textContent = p.label;
    btn.addEventListener("click", () => {
      wrap.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      t2.ctLabel = p.label;
      renderSnapshot();
    });
    wrap.appendChild(btn);
  });
}

function buildSnapDatePills(dates) {
  const wrap = document.getElementById("snap-date-pills");
  const options = [ { label:"Latest", date: dates[dates.length-1] } ];
  if (dates.length >= 7) {
    options.push({ label:"7d avg",  date:"7d" });
  }
  if (dates.length >= 14) {
    options.push({ label:"30d avg", date:"30d" });
  }
  options.forEach((opt,i) => {
    const btn = document.createElement("button");
    btn.className = "pill" + (i===0 ? " active" : "");
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      wrap.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      t2.date = opt.date;
      renderSnapshot();
    });
    wrap.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Legend
// ─────────────────────────────────────────────────────────────────────────────
function buildLegend() {
  const list = document.getElementById("legend-list");
  list.innerHTML = "";

  const groups = [
    { title:"Hyperscalers",         providers: allProviders.filter(p=>HYPERSCALERS.has(p)) },
    { title:"Enterprise GPU clouds", providers: allProviders.filter(p=>ENTERPRISE_GPU.has(p)) },
  ];
  const others = allProviders.filter(p=>!KEY_PROVIDERS.has(p));

  groups.forEach(g => {
    if (!g.providers.length) return;
    const titleEl = document.createElement("div");
    titleEl.className = "legend-group-title";
    titleEl.textContent = g.title;
    list.appendChild(titleEl);
    g.providers.forEach(p => list.appendChild(makeLegendItem(p)));
  });

  if (others.length) {
    const togBtn = document.createElement("button");
    togBtn.className = "legend-others-toggle";
    togBtn.innerHTML = `<span style="font-size:9px">▶</span>&nbsp;Other providers (${others.length})`;
    const othersDiv = document.createElement("div");
    othersDiv.className = "legend-others-group";
    others.forEach(p => othersDiv.appendChild(makeLegendItem(p)));
    togBtn.addEventListener("click", () => {
      const open = othersDiv.classList.toggle("open");
      togBtn.innerHTML = `<span style="font-size:9px">${open?"▼":"▶"}</span>&nbsp;Other providers (${others.length})`;
    });
    list.appendChild(togBtn);
    list.appendChild(othersDiv);
  }
}

function makeLegendItem(p) {
  const idx   = allProviders.indexOf(p);
  const color = provColor(p, idx);
  const el    = document.createElement("div");
  el.className = "legend-item" + (t1.visible.has(p) ? "" : " hidden-ds");
  el.dataset.provider = p;

  const swatch = document.createElement("span");
  swatch.className = "legend-swatch";
  swatch.style.background = color;

  const name = document.createElement("span");
  name.className = "legend-name";
  name.textContent = provDisp(p);
  if (p === "nebius") name.innerHTML += '<span class="you">you</span>';

  const price = document.createElement("span");
  price.className = "legend-price";
  price.dataset.priceholder = p;

  el.appendChild(swatch);
  el.appendChild(name);
  el.appendChild(price);

  el.addEventListener("click", () => toggleProvider(p));
  el.addEventListener("mouseenter", () => hoverLegendItem(p));
  el.addEventListener("mouseleave", clearHover);

  return el;
}

function updateLegendPrices() {
  const cts = ctSet(t1.ctLabel, CT_PILLS);
  const latestDate = [...new Set(allRows.map(r=>r.snapshot_date))].sort().pop();
  document.querySelectorAll("[data-priceholder]").forEach(el => {
    const p = el.dataset.priceholder;
    const row = allRows.find(r =>
      r.snapshot_date===latestDate && r.provider===p &&
      r.gpu_model===t1.gpu && cts.has(r.consumption_type));
    el.textContent = row ? `$${parseFloat(row.price_per_gpu_hour_usd).toFixed(2)}` : "—";
  });
}

function toggleProvider(p) {
  if (t1.visible.has(p)) t1.visible.delete(p);
  else t1.visible.add(p);
  document.querySelectorAll(`[data-provider="${p}"]`).forEach(el => {
    el.classList.toggle("hidden-ds", !t1.visible.has(p));
  });
  renderTrends();
}

function filterLegend(query) {
  document.querySelectorAll(".legend-item").forEach(el => {
    const name = (el.querySelector(".legend-name")?.textContent||"").toLowerCase();
    el.style.display = (!query || name.includes(query)) ? "" : "none";
  });
  // If searching, expand others
  if (query) {
    document.querySelector(".legend-others-group")?.classList.add("open");
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Hover / focus
// ─────────────────────────────────────────────────────────────────────────────
function applyHover(idx) {
  if (!chartT1) return;
  hoveredIdx = idx;
  chartT1.data.datasets.forEach((ds, i) => {
    const orig = origStyles[i] || {};
    const isTarget = i === idx;
    const alpha    = isTarget ? 1 : 0.07;
    ds.borderColor       = hexToRgba(orig.color||"#fff", isTarget ? 1 : 0.07);
    ds.pointBorderColor  = ds.borderColor;
    ds.pointBackgroundColor = ds.borderColor;
    ds.borderWidth       = isTarget ? Math.max((orig.width||1.5)+1, 3) : 1;
    ds.pointRadius       = isTarget ? (orig.radius||3)+2 : 2;
  });
  chartT1.update("none");

  // Dim legend items
  document.querySelectorAll(".legend-item").forEach((el,i) => {
    el.classList.toggle("dimmed", i !== idx);
  });

  // Focus chip
  const ds     = chartT1.data.datasets[idx];
  const chip   = document.getElementById("focus-chip");
  const pts    = ds.data.filter(d=>d.y!=null);
  const latest = pts[pts.length-1];
  if (ds && !ds._isIntel) {
    chip.textContent = latest
      ? `${ds.label}  ·  $${latest.y.toFixed(2)}/GPU-hr`
      : ds.label;
    chip.classList.add("visible");
  }
}

function clearHover() {
  if (!chartT1) return;
  hoveredIdx = null;
  chartT1.data.datasets.forEach((ds, i) => {
    const orig = origStyles[i] || {};
    ds.borderColor          = orig.color || "#fff";
    ds.pointBorderColor     = orig.color;
    ds.pointBackgroundColor = orig.color;
    ds.borderWidth          = orig.width  || 1.5;
    ds.pointRadius          = orig.radius || 3;
  });
  chartT1.update("none");
  document.querySelectorAll(".legend-item").forEach(el => el.classList.remove("dimmed"));
  document.getElementById("focus-chip").classList.remove("visible");
}

function hoverLegendItem(p) {
  const idx = chartT1?.data.datasets.findIndex(ds=>ds._provider===p);
  if (idx >= 0) applyHover(idx);
}

// ─────────────────────────────────────────────────────────────────────────────
// Tab 1: Trends chart
// ─────────────────────────────────────────────────────────────────────────────
function initTrendsChart() {
  const ctx = document.getElementById("chart-trends").getContext("2d");
  chartT1 = new Chart(ctx, {
    type:"line",
    data:{ datasets:[] },
    options:{
      responsive:true,
      animation:{ duration:200 },
      interaction:{ mode:"dataset", intersect:false },
      plugins:{
        legend:{ display:false },
        tooltip:{
          backgroundColor:"#151821", borderColor:"#252840", borderWidth:1,
          titleColor:"#e2e4f0", bodyColor:"#9096b8",
          callbacks:{
            title: items => {
              const pt = items[0]?.raw;
              return pt?._provider ? "" : items[0]?.label || "";
            },
            label: ctx => {
              const pt = ctx.raw;
              if (pt?._provider !== undefined) {
                return [
                  `  ◇ ${pt._provider}  $${ctx.parsed.y.toFixed(2)}/GPU-hr`,
                  `    Term: ${pt._term}  ·  Prepay: ${pt._prepay}`,
                  pt._notes ? `    ${pt._notes}` : null,
                ].filter(Boolean);
              }
              return `  ${ctx.dataset.label}:  $${ctx.parsed.y.toFixed(2)}/GPU-hr`;
            }
          }
        }
      },
      scales:{
        x:{ type:"time", time:{ unit:"day", tooltipFormat:"yyyy-MM-dd", displayFormats:{ day:"MMM d" } },
            ticks:{ color:"#6b7194", maxTicksLimit:8 }, grid:{ color:"#1a1d2a" } },
        y:{ title:{ display:true, text:"$/GPU-hr", color:"#6b7194", font:{ size:11 } },
            ticks:{ color:"#6b7194", callback:v=>`$${v.toFixed(2)}` },
            grid:{ color:"#1a1d2a" }, min:0 }
      }
    }
  });

  // Hover via canvas mousemove
  chartT1.canvas.addEventListener("mousemove", e => {
    const els = chartT1.getElementsAtEventForMode(e, "dataset", { intersect:false }, false);
    const idx = els.length ? els[0].datasetIndex : null;
    if (idx !== hoveredIdx) {
      if (idx !== null) applyHover(idx);
      else clearHover();
    }
  });
  chartT1.canvas.addEventListener("mouseleave", clearHover);
}

function renderTrends() {
  const cts     = ctSet(t1.ctLabel, CT_PILLS);
  const filtered = allRows.filter(r => r.gpu_model===t1.gpu && cts.has(r.consumption_type));

  const noData = document.getElementById("no-data");

  if (!filtered.length) {
    chartT1.data.datasets = [];
    chartT1.update();
    noData.style.display = "";
    chartT1.canvas.style.display = "none";
    return;
  }
  noData.style.display = "none";
  chartT1.canvas.style.display = "";

  // Group by provider
  const byProv = {};
  for (const r of filtered) {
    if (!byProv[r.provider]) byProv[r.provider] = [];
    byProv[r.provider].push({ x:r.snapshot_date, y:parseFloat(r.price_per_gpu_hour_usd) });
  }
  for (const pts of Object.values(byProv)) pts.sort((a,b)=>a.x.localeCompare(b.x));

  const orderedProvs = allProviders.filter(p=>byProv[p]);
  origStyles = [];

  const lineDatasets = orderedProvs.map((p, i) => {
    const color    = provColor(p, allProviders.indexOf(p));
    const isNebius = p === "nebius";
    const style    = { color, width: isNebius?2.5:1.5, radius: isNebius?5:3.5 };
    origStyles.push(style);
    return {
      label:                provDisp(p),
      _provider:            p,
      _isIntel:             false,
      data:                 byProv[p],
      borderColor:          color,
      backgroundColor:      color+"18",
      pointBackgroundColor: color,
      pointBorderColor:     color,
      borderWidth:          style.width,
      pointRadius:          style.radius,
      pointHoverRadius:     style.radius+2,
      tension:              0.12,
      spanGaps:             false,
      hidden:               !t1.visible.has(p),
      order:                isNebius ? 0 : 1,
    };
  });

  // Intel scatter overlay
  const intelDatasets = [];
  if (t1.showIntel) {
    const gpuIntel = intelRows.filter(r => r.gpu_model===t1.gpu && r.provider_type!=="nebius");
    if (gpuIntel.length) {
      const scatterPts = gpuIntel.map(r => {
        const tm = parseInt(r.term_months)||0;
        const termStr = tm===0?"On-demand":tm<12?`${tm}mo`:`${Math.floor(tm/12)}yr${tm%12?` ${tm%12}mo`:""}`;
        return { x:r.message_date, y:parseFloat(r.price_per_gpu_hour_usd),
          _provider:r.provider_name||"Undisclosed", _term:termStr,
          _prepay:`${r.prepay_pct||0}%`, _notes:r.notes||"", _isIntel:true };
      });
      origStyles.push({ color:"#f5c842", width:0, radius:6 });
      intelDatasets.push({
        type:"scatter", label:"◇ Field intel", _isIntel:true,
        data:scatterPts, showLine:false,
        pointStyle:"rectRot", pointRadius:6, pointHoverRadius:8,
        pointBorderWidth:1.5, pointBorderColor:"#f5c842",
        pointBackgroundColor:"transparent", borderColor:"transparent",
        order:-1,
      });
    }
  }

  chartT1.data.datasets = [...lineDatasets, ...intelDatasets];
  chartT1.update();
  updateLegendPrices();
}

// ─────────────────────────────────────────────────────────────────────────────
// Tab 2: Market Snapshot
// ─────────────────────────────────────────────────────────────────────────────
const SNAP_PROVIDERS = [...KEY_PROVIDERS]
  .sort((a,b) => {
    // Nebius first, then hyperscalers, then enterprise GPU
    if (a==="nebius") return -1;
    if (b==="nebius") return 1;
    if (HYPERSCALERS.has(a) && !HYPERSCALERS.has(b)) return 1;
    if (!HYPERSCALERS.has(a) && HYPERSCALERS.has(b)) return -1;
    return provDisp(a).localeCompare(provDisp(b));
  });

function getSnapRows(dateParam, cts) {
  const allDates = [...new Set(allRows.map(r=>r.snapshot_date))].sort();
  let rows;
  if (dateParam==="7d") {
    const recent = allDates.slice(-7);
    const candidates = allRows.filter(r => recent.includes(r.snapshot_date) && cts.has(r.consumption_type));
    // average per provider+gpu
    const grouped = {};
    for (const r of candidates) {
      const key = `${r.provider}|${r.gpu_model}`;
      if (!grouped[key]) grouped[key] = { ...r, _prices:[] };
      grouped[key]._prices.push(parseFloat(r.price_per_gpu_hour_usd));
    }
    rows = Object.values(grouped).map(g => ({
      ...g, price_per_gpu_hour_usd: g._prices.reduce((a,b)=>a+b,0)/g._prices.length }));
  } else if (dateParam==="30d") {
    const recent = allDates.slice(-30);
    const candidates = allRows.filter(r => recent.includes(r.snapshot_date) && cts.has(r.consumption_type));
    const grouped = {};
    for (const r of candidates) {
      const key = `${r.provider}|${r.gpu_model}`;
      if (!grouped[key]) grouped[key] = { ...r, _prices:[] };
      grouped[key]._prices.push(parseFloat(r.price_per_gpu_hour_usd));
    }
    rows = Object.values(grouped).map(g => ({
      ...g, price_per_gpu_hour_usd: g._prices.reduce((a,b)=>a+b,0)/g._prices.length }));
  } else {
    rows = allRows.filter(r => r.snapshot_date===dateParam && cts.has(r.consumption_type));
  }
  return rows;
}

function initSnapshotChart() {
  const ctx = document.getElementById("chart-snapshot").getContext("2d");
  chartT2 = new Chart(ctx, {
    type:"bar",
    data:{ labels:[], datasets:[] },
    options:{
      responsive:true,
      animation:{ duration:200 },
      plugins:{
        legend:{ display:true, position:"bottom",
          labels:{ color:"#6b7194", boxWidth:10, boxHeight:10, padding:12, font:{ size:11 } } },
        tooltip:{
          backgroundColor:"#151821", borderColor:"#252840", borderWidth:1,
          titleColor:"#e2e4f0", bodyColor:"#9096b8",
          callbacks:{ label: ctx=>`  ${ctx.dataset.label}: $${(ctx.parsed.y||0).toFixed(2)}/GPU-hr` }
        }
      },
      scales:{
        x:{ ticks:{ color:"#6b7194", font:{ family:"monospace" } }, grid:{ color:"#1a1d2a" } },
        y:{ title:{ display:true, text:"$/GPU-hr", color:"#6b7194", font:{ size:11 } },
            ticks:{ color:"#6b7194", callback:v=>`$${v.toFixed(2)}` },
            grid:{ color:"#1a1d2a" }, min:0 }
      }
    }
  });
}

function renderSnapshot() {
  const cts  = ctSet(t2.ctLabel, SNAP_CT_PILLS);
  const rows = getSnapRows(t2.date, cts);

  // Only GPUs that have at least one provider with data
  const availGPUs = GPU_ORDER.filter(g => rows.some(r=>r.gpu_model===g));
  // Only providers in SNAP_PROVIDERS that have data
  const availProv = SNAP_PROVIDERS.filter(p => rows.some(r=>r.provider===p));

  // Cheapest per provider+gpu
  function bestPrice(p, g) {
    const cands = rows.filter(r=>r.provider===p && r.gpu_model===g);
    return cands.length ? Math.min(...cands.map(r=>parseFloat(r.price_per_gpu_hour_usd))) : null;
  }

  chartT2.data.labels = availGPUs;
  chartT2.data.datasets = availProv.map(p => {
    const color    = provColor(p, allProviders.indexOf(p));
    const isNebius = p==="nebius";
    return {
      label:           provDisp(p),
      data:            availGPUs.map(g=>bestPrice(p,g)),
      backgroundColor: color + (isNebius?"ee":"88"),
      borderColor:     color,
      borderWidth:     isNebius ? 2 : 0,
      borderSkipped:   false,
      borderRadius:    3,
    };
  });
  chartT2.update();

  // Summary cards
  const sumEl = document.getElementById("snap-summary");
  sumEl.innerHTML = "";
  availGPUs.forEach(gpu => {
    const gpuRows = rows.filter(r=>r.gpu_model===gpu)
      .map(r=>({ provider:r.provider, price:parseFloat(r.price_per_gpu_hour_usd) }));
    // Deduplicate: cheapest per provider
    const deduped = Object.values(gpuRows.reduce((acc, r) => {
      if (!acc[r.provider] || r.price < acc[r.provider].price) acc[r.provider] = r;
      return acc;
    }, {})).sort((a,b)=>a.price-b.price);

    const total   = deduped.length;
    const nebRow  = deduped.find(r=>r.provider==="nebius");
    const nebRank = nebRow ? deduped.indexOf(nebRow)+1 : null;
    const floor   = deduped[0];
    const median  = deduped[Math.floor(total/2)];
    const isNeb   = !!nebRow;

    const card = document.createElement("div");
    card.className = "snap-card" + (isNeb?" snap-card-nebius":"");

    let rankBadge = "";
    if (nebRank) {
      const cls = nebRank<=2?"good":nebRank<=Math.ceil(total*0.5)?"":"bad";
      rankBadge = `<span class="rank-badge ${cls}">#${nebRank} of ${total}</span>`;
    }

    card.innerHTML = `
      <div class="snap-card-gpu">${gpu}</div>
      ${nebRow ? `<div class="snap-card-row">
        <span class="label">Nebius ${rankBadge}</span>
        <span class="val" style="color:var(--accent)">$${nebRow.price.toFixed(2)}</span>
      </div>` : `<div class="snap-card-row"><span class="label" style="color:var(--muted)">Nebius — no data</span></div>`}
      <div class="snap-card-row">
        <span class="label">Floor (${provDisp(floor.provider)})</span>
        <span class="val">$${floor.price.toFixed(2)}</span>
      </div>
      <div class="snap-card-row">
        <span class="label">Market median</span>
        <span class="val">$${median.price.toFixed(2)}</span>
      </div>
      <div class="snap-card-row">
        <span class="label">Providers tracked</span>
        <span class="val">${total}</span>
      </div>
    `;
    sumEl.appendChild(card);
  });
}
